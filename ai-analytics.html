<!doctype html>
<html lang="fr" data-theme="dark">
<head>
  <link rel="icon" type="image/svg+xml" href="./kent-logo.svg">
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Analyse Co - KENT</title>
  <script src="./shared-ui.js"></script>
  <link rel="stylesheet" href="./shared-theme.css" />
  <style>
    :root {
      --bg: #0b0b0c;
      --bg-soft: #121316;
      --panel: #181a1f;
      --panel-soft: #1f2430;
      --line: rgba(255, 255, 255, 0.12);
      --line-soft: rgba(255, 255, 255, 0.08);
      --text: #eceff5;
      --muted: #9ea7b8;
      --accent: #3ea6ff;
      --accent-2: #2e7cf4;
      --ok: #22c55e;
      --err: #ef4444;
      --shadow: 0 20px 46px rgba(0, 0, 0, 0.45);
    }

    * { box-sizing: border-box; }

    html,
    body {
      margin: 0;
      min-height: 100%;
      font-family: "Aptos", "Segoe UI", sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 0% 0%, rgba(27, 122, 255, 0.16), transparent 28%),
        radial-gradient(circle at 100% 0%, rgba(22, 163, 74, 0.12), transparent 26%),
        linear-gradient(180deg, #090909 0%, #0b0c0f 100%);
    }

    .app-shell {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 20;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 18px 26px;
      background: rgba(9, 10, 12, 0.82);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--line-soft);
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 1.02rem;
      font-weight: 700;
      letter-spacing: 0.01em;
    }

    .brand-pill {
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 7px 12px;
      color: #dbe9ff;
      background: rgba(62, 166, 255, 0.1);
      font-size: 0.78rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    .workspace {
      width: min(1120px, 100%);
      margin: 0 auto;
      padding: 34px 22px 260px;
      display: grid;
      gap: 16px;
    }

    .welcome {
      text-align: center;
      margin-top: 9vh;
      margin-bottom: 6px;
      transition: opacity 0.25s ease;
    }

    .welcome[hidden] {
      display: none;
    }

    .welcome h1 {
      margin: 0;
      font-size: clamp(2rem, 4.2vw, 3rem);
      letter-spacing: -0.03em;
      font-weight: 700;
    }

    .welcome p {
      margin: 10px 0 0;
      color: var(--muted);
      font-size: 1rem;
    }

    .thread {
      display: grid;
      gap: 12px;
      margin-top: 8px;
    }

    .message-row {
      display: flex;
    }

    .message-row.user {
      justify-content: flex-end;
    }

    .bubble {
      max-width: min(860px, 100%);
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 12px 14px;
      line-height: 1.45;
      font-size: 0.95rem;
      background: var(--panel-soft);
      box-shadow: var(--shadow);
      white-space: pre-wrap;
      word-break: break-word;
    }

    .message-row.user .bubble {
      background: linear-gradient(135deg, rgba(46, 124, 244, 0.26), rgba(62, 166, 255, 0.18));
      border-color: rgba(62, 166, 255, 0.42);
      color: #e8f4ff;
    }

    .bubble .meta {
      display: block;
      margin-top: 8px;
      color: var(--muted);
      font-size: 0.82rem;
      line-height: 1.45;
    }

    .bubble h4 {
      margin: 9px 0 6px;
      font-size: 0.9rem;
    }

    .bubble ul {
      margin: 0;
      padding-left: 18px;
      display: grid;
      gap: 4px;
    }

    .result-panel {
      border: 1px solid var(--line-soft);
      border-radius: 18px;
      background: rgba(15, 19, 25, 0.86);
      padding: 14px;
      display: grid;
      gap: 12px;
    }

    .result-panel[hidden] {
      display: none;
    }

    .result-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
    }

    .result-head h2 {
      margin: 0;
      font-size: 1.02rem;
      letter-spacing: -0.01em;
    }

    .result-head .meta {
      margin: 0;
      color: var(--muted);
      font-size: 0.8rem;
      line-height: 1.35;
    }

    .table-wrap {
      overflow: auto;
      border: 1px solid var(--line-soft);
      border-radius: 14px;
      background: #0e131a;
      max-height: 62vh;
    }

    table {
      width: 100%;
      min-width: 840px;
      border-collapse: collapse;
    }

    th,
    td {
      padding: 10px;
      text-align: left;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      font-size: 0.86rem;
      vertical-align: top;
    }

    th {
      position: sticky;
      top: 0;
      background: #152030;
      color: #deebff;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      font-size: 0.73rem;
      z-index: 2;
    }

    .composer-dock {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 30;
      background: linear-gradient(180deg, rgba(10, 10, 12, 0) 0%, rgba(10, 10, 12, 0.92) 22%, rgba(10, 10, 12, 0.98) 100%);
      padding: 18px 18px 20px;
    }

    .composer-inner {
      width: min(1120px, 100%);
      margin: 0 auto;
      display: grid;
      gap: 10px;
    }

    .status {
      color: var(--muted);
      font-size: 0.88rem;
      min-height: 20px;
      padding: 0 4px;
    }

    .status.ok { color: #bff4d0; }
    .status.err { color: #fecaca; }

    .composer {
      border: 1px solid var(--line);
      border-radius: 30px;
      background: #1a1c21;
      box-shadow: var(--shadow);
      display: grid;
      grid-template-columns: 44px minmax(0, 1fr) 84px 52px;
      align-items: center;
      gap: 8px;
      padding: 6px;
    }

    .icon-btn,
    .send-btn {
      border: none;
      outline: none;
      cursor: pointer;
      border-radius: 999px;
      width: 40px;
      height: 40px;
      display: grid;
      place-items: center;
      font-size: 1.35rem;
      color: #dce9ff;
      background: rgba(255, 255, 255, 0.06);
    }

    .icon-btn:hover,
    .send-btn:hover {
      background: rgba(62, 166, 255, 0.2);
    }

    .composer input[type="text"] {
      border: none;
      background: transparent;
      color: var(--text);
      font-size: 1.05rem;
      padding: 0;
      outline: none;
    }

    .composer input[type="text"]::placeholder {
      color: #9aa4b5;
    }

    .limit-box {
      border: 1px solid var(--line);
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.04);
      height: 40px;
      display: flex;
      align-items: center;
      padding: 0 8px;
    }

    .limit-box input {
      width: 100%;
      border: none;
      background: transparent;
      color: var(--text);
      outline: none;
      font-size: 0.94rem;
      text-align: center;
    }

    .send-btn {
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      color: #ffffff;
      font-size: 1rem;
      font-weight: 700;
    }

    .quick-questions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      padding: 0 4px;
    }

    .quick-questions[hidden] {
      display: none;
    }

    .q-chip {
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 8px 11px;
      font-size: 0.84rem;
      color: #dbe8fa;
      background: rgba(255, 255, 255, 0.06);
      cursor: pointer;
    }

    .q-chip:hover {
      background: rgba(62, 166, 255, 0.16);
      border-color: rgba(62, 166, 255, 0.42);
    }

    .quick-actions {
      display: flex;
      justify-content: flex-end;
      padding: 0 4px;
    }

    .ghost-btn {
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 7px 10px;
      font-size: 0.78rem;
      color: var(--muted);
      background: rgba(255, 255, 255, 0.04);
      cursor: pointer;
    }

    .ghost-btn:hover {
      color: #dceaff;
      border-color: rgba(62, 166, 255, 0.4);
      background: rgba(62, 166, 255, 0.12);
    }

    .loading {
      display: none;
      margin-top: -2px;
      padding: 0 6px;
    }

    .loading.active {
      display: block;
    }

    .loading-line {
      width: 100%;
      height: 6px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.09);
      overflow: hidden;
    }

    .loading-line span {
      display: block;
      width: 30%;
      height: 100%;
      border-radius: 999px;
      background: linear-gradient(90deg, #54bfff, #71efc1);
      animation: move 1.1s linear infinite;
    }

    @keyframes move {
      from { transform: translateX(-130%); }
      to { transform: translateX(340%); }
    }

    @media (max-width: 820px) {
      .topbar {
        padding: 14px 14px;
      }

      .workspace {
        padding: 24px 12px 262px;
      }

      .welcome {
        margin-top: 5vh;
      }

      .welcome h1 {
        font-size: clamp(1.5rem, 8vw, 2rem);
      }

      .composer {
        grid-template-columns: 40px minmax(0, 1fr) 66px 44px;
      }

      .composer input[type="text"] {
        font-size: 0.97rem;
      }

      .icon-btn,
      .send-btn {
        width: 36px;
        height: 36px;
      }

      .limit-box {
        height: 36px;
      }

      table {
        min-width: 680px;
      }
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div class="brand">Analyse Co</div>
      <div class="brand-pill">Analyse Co</div>
    </header>

    <main class="workspace">
      <section class="welcome" id="welcomeState">
        <h1>Bonjour. On commence ?</h1>
        <p>Pose une question commerciale.</p>
      </section>

      <section class="thread" id="thread"></section>

      <section class="result-panel" id="resultPanel" hidden>
        <div class="result-head">
          <h2>Tableau de resultat</h2>
          <p class="meta" id="metaBox">-</p>
        </div>
        <div class="table-wrap">
          <table>
            <thead id="thead"></thead>
            <tbody id="tbody">
              <tr><td>Aucun resultat pour le moment.</td></tr>
            </tbody>
          </table>
        </div>
      </section>
    </main>

    <footer class="composer-dock">
      <div class="composer-inner">
        <div class="status" id="statusBox">Prêt.</div>

        <div class="composer" role="group" aria-label="Saisie Analyse Co">
          <button class="icon-btn" id="resetSeenQuestionsBtn" type="button" title="Reafficher les suggestions">+</button>
          <input id="questionInput" type="text" placeholder="Poser une question" value="" />
          <div class="limit-box" title="Limite de lignes">
            <input id="limitInput" type="number" min="1" max="1000" value="10" />
          </div>
          <button class="send-btn" id="askBtn" type="button" aria-label="Analyser">Go</button>
        </div>

        <div class="loading" id="loadingBox">
          <div class="loading-line"><span></span></div>
        </div>

        <div class="quick-questions" id="quickQuestions"></div>
        <div class="quick-actions">
          <button type="button" class="ghost-btn" id="resetSeenQuestionsSecondary">Reafficher les suggestions</button>
        </div>
      </div>
    </footer>
  </div>

  <script>
    const SEEN_QUESTIONS_KEY = "analyse_co_seen_questions_v1";

    const dom = {
      welcomeState: document.getElementById("welcomeState"),
      thread: document.getElementById("thread"),
      resultPanel: document.getElementById("resultPanel"),
      thead: document.getElementById("thead"),
      tbody: document.getElementById("tbody"),
      metaBox: document.getElementById("metaBox"),
      statusBox: document.getElementById("statusBox"),
      loadingBox: document.getElementById("loadingBox"),
      quickQuestions: document.getElementById("quickQuestions"),
      resetSeenQuestionsBtn: document.getElementById("resetSeenQuestionsBtn"),
      resetSeenQuestionsSecondary: document.getElementById("resetSeenQuestionsSecondary"),
      questionInput: document.getElementById("questionInput"),
      limitInput: document.getElementById("limitInput"),
      askBtn: document.getElementById("askBtn")
    };

    const defaultQuickQuestions = [
      "Quel est mon top 10 produit sur ce mois ?",
      "Quels clients ont le plus fort CA sur ce mois ?",
      "Compare ce mois avec le mois dernier.",
      "Quels clients sont inactifs depuis 2 mois ?",
      "Donne-moi les produits qui performent le moins cette periode.",
      "Quelles actions urgentes recommandes-tu cette semaine ?"
    ];

    const seenQuestions = loadSeenQuestions();

    function esc(value) {
      return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function normalizeQuestionKey(question) {
      return String(question || "").trim().toLowerCase();
    }

    function loadSeenQuestions() {
      try {
        const raw = localStorage.getItem(SEEN_QUESTIONS_KEY);
        if (!raw) return new Set();
        const parsed = JSON.parse(raw);
        if (!Array.isArray(parsed)) return new Set();
        return new Set(parsed.map(normalizeQuestionKey).filter(Boolean));
      } catch {
        return new Set();
      }
    }

    function saveSeenQuestions() {
      try {
        localStorage.setItem(SEEN_QUESTIONS_KEY, JSON.stringify(Array.from(seenQuestions)));
      } catch {}
    }

    function markQuestionAsSeen(question) {
      const key = normalizeQuestionKey(question);
      if (!key) return;
      seenQuestions.add(key);
      saveSeenQuestions();
    }

    function isQuestionSeen(question) {
      return seenQuestions.has(normalizeQuestionKey(question));
    }

    function setStatus(message, kind = "") {
      dom.statusBox.className = "status" + (kind ? " " + kind : "");
      dom.statusBox.textContent = message;
    }

    function setLoading(loading) {
      dom.askBtn.disabled = loading;
      dom.loadingBox.classList.toggle("active", loading);
    }

    function setWelcomeVisibility() {
      dom.welcomeState.hidden = dom.thread.children.length > 0;
    }

    function addMessage(role, text, detail = "") {
      const row = document.createElement("div");
      row.className = "message-row " + (role === "user" ? "user" : "assistant");
      const safeText = esc(text || "-");
      const safeDetail = detail ? `<span class="meta">${esc(detail)}</span>` : "";
      row.innerHTML = `<div class="bubble">${safeText}${safeDetail}</div>`;
      dom.thread.appendChild(row);

      while (dom.thread.children.length > 40) {
        dom.thread.removeChild(dom.thread.firstChild);
      }

      setWelcomeVisibility();
      window.scrollTo({ top: document.body.scrollHeight, behavior: "smooth" });
    }

    function addAnalysisMessage(analysis) {
      const insights = Array.isArray(analysis?.insights) ? analysis.insights : [];
      const recommendations = Array.isArray(analysis?.recommendations) ? analysis.recommendations : [];
      if (!insights.length && !recommendations.length) return;

      const row = document.createElement("div");
      row.className = "message-row assistant";

      const insightsBlock = insights.length
        ? `<h4>Insights</h4><ul>${insights.slice(0, 5).map(item => `<li>${esc(item)}</li>`).join("")}</ul>`
        : "";
      const recommendationsBlock = recommendations.length
        ? `<h4>Recommandations</h4><ul>${recommendations.slice(0, 5).map(item => `<li>${esc(item)}</li>`).join("")}</ul>`
        : "";

      row.innerHTML = `<div class="bubble">${insightsBlock}${recommendationsBlock}</div>`;
      dom.thread.appendChild(row);
      setWelcomeVisibility();
    }

    function formatCurrency(value) {
      return Number(value || 0).toLocaleString("fr-FR", {
        style: "currency",
        currency: "EUR",
        minimumFractionDigits: 2,
        maximumFractionDigits: 2
      });
    }

    function formatNumber(value) {
      const n = Number(value || 0);
      return n.toLocaleString("fr-FR", {
        minimumFractionDigits: Number.isInteger(n) ? 0 : 2,
        maximumFractionDigits: 2
      });
    }

    function looksLikeMoneyColumn(columnName) {
      return /(ca|chiffre|euro|eur|montant|prix|panier|total)/i.test(String(columnName || ""));
    }

    function looksLikeNumericText(value) {
      if (typeof value !== "string") return false;
      const trimmed = value.trim();
      if (!trimmed) return false;
      return /^-?\d+(?:[.,]\d+)?$/.test(trimmed);
    }

    function formatCellValue(columnName, rawValue) {
      if (rawValue == null) return "";
      const column = String(columnName || "");
      if (/id|compte|numero|reference|ref/i.test(column)) {
        return String(rawValue);
      }

      const numericCandidate =
        typeof rawValue === "number"
          ? rawValue
          : looksLikeNumericText(rawValue)
            ? Number(String(rawValue).replace(",", "."))
            : NaN;

      if (!Number.isFinite(numericCandidate)) return String(rawValue);
      if (looksLikeMoneyColumn(column)) return formatCurrency(numericCandidate);
      return formatNumber(numericCandidate);
    }

    function renderTable(columns, rows) {
      if (!Array.isArray(columns) || !columns.length) {
        dom.thead.innerHTML = "";
        dom.tbody.innerHTML = "<tr><td>Aucune colonne.</td></tr>";
        dom.resultPanel.hidden = false;
        return;
      }

      dom.thead.innerHTML = `<tr>${columns.map(col => `<th>${esc(col)}</th>`).join("")}</tr>`;

      if (!Array.isArray(rows) || !rows.length) {
        dom.tbody.innerHTML = `<tr><td colspan="${columns.length}">Aucune ligne retournee.</td></tr>`;
        dom.resultPanel.hidden = false;
        return;
      }

      dom.tbody.innerHTML = rows.map(row => {
        return `<tr>${columns.map(col => `<td>${esc(formatCellValue(col, row[col]))}</td>`).join("")}</tr>`;
      }).join("");

      dom.resultPanel.hidden = false;
    }

    function renderQuickQuestionButtons(questions) {
      const list = Array.isArray(questions) && questions.length ? questions : defaultQuickQuestions;
      const filtered = list.filter(question => !isQuestionSeen(question));

      if (!filtered.length) {
        dom.quickQuestions.hidden = true;
        dom.quickQuestions.innerHTML = "";
        return;
      }

      dom.quickQuestions.hidden = false;
      dom.quickQuestions.innerHTML = filtered.slice(0, 8).map(question => {
        return `<button type="button" class="q-chip" data-question="${esc(question)}">${esc(question)}</button>`;
      }).join("");

      dom.quickQuestions.querySelectorAll("[data-question]").forEach(button => {
        button.addEventListener("click", () => {
          const question = button.getAttribute("data-question") || "";
          markQuestionAsSeen(question);
          dom.questionInput.value = question;
          ask();
        });
      });
    }

    function resetSuggestions() {
      seenQuestions.clear();
      saveSeenQuestions();
      renderQuickQuestionButtons(defaultQuickQuestions);
      setStatus("Suggestions reaffichees.", "");
    }

    async function ask() {
      const question = dom.questionInput.value.trim();
      const limit = Math.min(1000, Math.max(1, Number(dom.limitInput.value || 10)));

      if (!question) {
        setStatus("Saisis une question.", "err");
        return;
      }

      try {
        setLoading(true);
        setStatus("Analyse en cours...", "");
        markQuestionAsSeen(question);
        addMessage("user", question);

        const res = await fetch("/api/ai-query", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ question, limit })
        });

        const data = await res.json();
        if (!res.ok || !data?.ok) {
          const msg = data?.message || "Requête impossible.";
          const code = data?.errorCode ? ` [${data.errorCode}]` : "";
          throw new Error(msg + code);
        }

        addMessage("assistant", data.summary || "Analyse terminee.", data.finalResult || "");
        addAnalysisMessage(data.analysis || {});
        renderTable(data.columns || [], data.rows || []);

        dom.metaBox.textContent =
          `Intent: ${data.intent || "-"} | Lignes: ${(data.rows || []).length} | Periode: ${data.meta?.period || "-"}`;

        const followUp = Array.isArray(data.analysis?.followUpQuestions)
          ? data.analysis.followUpQuestions
          : [];
        renderQuickQuestionButtons([...followUp, ...defaultQuickQuestions]);
        setStatus("Analyse terminee.", "ok");
      } catch (error) {
        console.error(error);
        addMessage("assistant", "Je n'ai pas pu terminer l'analyse.", error.message || "Erreur technique");
        setStatus(error.message || "Erreur pendant l'analyse.", "err");
      } finally {
        setLoading(false);
      }
    }

    renderQuickQuestionButtons(defaultQuickQuestions);
    setWelcomeVisibility();

    dom.askBtn.addEventListener("click", ask);
    dom.questionInput.addEventListener("keydown", event => {
      if (event.key === "Enter") ask();
    });
    dom.resetSeenQuestionsBtn.addEventListener("click", resetSuggestions);
    dom.resetSeenQuestionsSecondary.addEventListener("click", resetSuggestions);
  </script>
</body>
</html>
