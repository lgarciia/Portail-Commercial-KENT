<!doctype html>
<html lang="fr" data-theme="dark">
<head>
  <link rel="icon" type="image/svg+xml" href="./kent-logo.svg">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Reporting - Selecteur</title>
  <script src="./app-data-config.js"></script>
  <script src="./shared-ui.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./reel-supabase.js"></script>
  <style>
    :root{
      --bg:#07111f;
      --panel:rgba(15,23,42,.84);
      --panel2:rgba(15,23,42,.62);
      --line:rgba(148,163,184,.18);
      --text:#eef4ff;
      --muted:rgba(226,232,240,.66);
      --blue:#38bdf8;
      --green:#22c55e;
      --gold:#f59e0b;
      --red:#ef4444;
      --shadow:0 26px 78px rgba(0,0,0,.36);
    }

    *{box-sizing:border-box}
    html,body{min-height:100%}
    body{
      margin:0;
      font-family:ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      color:var(--text);
      background:
        radial-gradient(980px 700px at 10% -8%, rgba(56,189,248,.18), transparent 58%),
        radial-gradient(900px 680px at 92% 0%, rgba(34,197,94,.13), transparent 55%),
        radial-gradient(860px 720px at 54% 112%, rgba(245,158,11,.08), transparent 58%),
        var(--bg);
      overflow:hidden;
    }

    .page{
      min-height:100vh;
      display:grid;
      grid-template-rows:auto 1fr;
      gap:10px;
      padding:14px;
    }

    .hero,.viewer{
      border:1px solid var(--line);
      box-shadow:var(--shadow);
      backdrop-filter:blur(14px);
    }

    .hero{
      border-radius:24px;
      background:
        linear-gradient(135deg, rgba(15,23,42,.95), rgba(15,23,42,.72)),
        radial-gradient(620px 280px at 96% 0%, rgba(56,189,248,.14), transparent 64%);
      padding:13px 14px;
    }

    .heroTop{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      flex-wrap:wrap;
    }

    .kicker{
      display:inline-flex;
      align-items:center;
      gap:8px;
      border:1px solid rgba(56,189,248,.28);
      background:rgba(56,189,248,.11);
      color:#d8f3ff;
      border-radius:999px;
      padding:5px 10px;
      font-size:11px;
      font-weight:950;
      letter-spacing:.12em;
      text-transform:uppercase;
    }
    .kicker::before{
      content:"";
      width:7px;
      height:7px;
      border-radius:999px;
      background:var(--blue);
      box-shadow:0 0 18px rgba(56,189,248,.65);
    }

    h1{
      margin:8px 0 4px;
      font-size:clamp(25px,3vw,40px);
      line-height:1;
      letter-spacing:-.055em;
    }
    .subtitle{
      margin:0;
      max-width:760px;
      color:var(--muted);
      font-size:13px;
      line-height:1.35;
      font-weight:750;
    }

    .actions{
      display:flex;
      align-items:center;
      justify-content:flex-end;
      gap:7px;
      flex-wrap:wrap;
    }
    .btn,.select{
      min-height:36px;
      border:1px solid rgba(148,163,184,.20);
      border-radius:13px;
      background:rgba(255,255,255,.07);
      color:var(--text);
      font-weight:950;
      font-size:12px;
      padding:0 11px;
      box-shadow:0 14px 34px rgba(0,0,0,.20);
    }
    .btn{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      text-decoration:none;
      cursor:pointer;
      transition:.16s transform,.16s border-color,.16s background;
    }
    .btn:hover{transform:translateY(-1px);border-color:rgba(56,189,248,.36)}
    .btn.primary{
      color:#fff;
      border-color:rgba(56,189,248,.38);
      background:linear-gradient(135deg,#38bdf8,#2563eb);
    }
    .select{
      min-width:170px;
      outline:none;
      cursor:pointer;
    }

    .optionGrid{
      display:flex;
      align-items:center;
      gap:6px;
      margin-top:8px;
      padding:1px 2px 5px;
      overflow-x:auto;
      overflow-y:hidden;
      scrollbar-width:thin;
      scrollbar-color:rgba(56,189,248,.36) transparent;
    }
    .optionGrid::-webkit-scrollbar{height:6px}
    .optionGrid::-webkit-scrollbar-track{background:transparent}
    .optionGrid::-webkit-scrollbar-thumb{background:rgba(56,189,248,.34);border-radius:999px}
    .optionCard{
      flex:0 0 auto;
      border:1px solid rgba(148,163,184,.16);
      border-radius:999px;
      background:rgba(255,255,255,.055);
      padding:6px 12px;
      cursor:pointer;
      min-height:31px;
      min-width:76px;
      transition:.16s transform,.16s border-color,.16s background,.16s box-shadow;
    }
    .optionCard:hover{
      transform:translateY(-1px);
      border-color:rgba(56,189,248,.34);
      background:rgba(255,255,255,.075);
    }
    .optionCard.active{
      border-color:rgba(56,189,248,.60);
      background:linear-gradient(135deg,rgba(56,189,248,.16),rgba(255,255,255,.06));
      box-shadow:0 18px 42px rgba(56,189,248,.13);
    }
    .optionName{
      display:flex;
      align-items:center;
      justify-content:center;
      gap:0;
      font-size:12px;
      font-weight:980;
      letter-spacing:-.03em;
    }
    .optionMeta{
      display:none;
    }
    .tag{
      flex:0 0 auto;
      border:1px solid rgba(255,255,255,.13);
      background:rgba(255,255,255,.075);
      color:rgba(226,232,240,.76);
      border-radius:999px;
      padding:3px 6px;
      font-size:9px;
      font-weight:950;
      text-transform:uppercase;
      letter-spacing:.06em;
    }
    .tag.ready{color:#bbf7d0;border-color:rgba(34,197,94,.26);background:rgba(34,197,94,.11)}
    .tag.wait{color:#fde68a;border-color:rgba(245,158,11,.30);background:rgba(245,158,11,.10)}
    .optionCard .tag{display:none}

    .viewer{
      position:relative;
      min-height:0;
      border-radius:24px;
      background:rgba(2,6,23,.42);
      overflow:hidden;
    }
    iframe{
      width:100%;
      height:100%;
      min-height:570px;
      border:0;
      display:block;
      background:#0b0f17;
    }
    .status{
      position:absolute;
      right:16px;
      top:16px;
      z-index:2;
      border:1px solid rgba(148,163,184,.18);
      background:rgba(15,23,42,.88);
      color:rgba(226,232,240,.76);
      border-radius:999px;
      padding:8px 11px;
      font-size:12px;
      font-weight:900;
      pointer-events:none;
    }

    html[data-theme="light"] body{
      background:
        radial-gradient(980px 700px at 10% -8%, rgba(56,189,248,.14), transparent 58%),
        radial-gradient(900px 680px at 92% 0%, rgba(34,197,94,.10), transparent 55%),
        #f6f7fb;
      color:#0f172a;
    }
    html[data-theme="light"] .hero,
    html[data-theme="light"] .viewer{
      background:rgba(255,255,255,.84);
      color:#0f172a;
      border-color:rgba(15,23,42,.10);
      box-shadow:0 24px 60px rgba(15,23,42,.12);
    }
    html[data-theme="light"] .subtitle,
    html[data-theme="light"] .optionMeta{color:rgba(15,23,42,.60)}
    html[data-theme="light"] .optionCard,
    html[data-theme="light"] .select,
    html[data-theme="light"] .btn:not(.primary){
      background:rgba(255,255,255,.80);
      color:#0f172a;
      border-color:rgba(15,23,42,.10);
    }

    @media(max-width:1180px){
      body{overflow:auto}
      .page{grid-template-rows:auto auto}
      iframe{height:72vh}
    }
    @media(max-width:620px){
      .page{padding:12px}
      .actions{justify-content:flex-start;width:100%}
      .select,.btn{width:100%}
    }
  </style>
  <link rel="stylesheet" href="./shared-theme.css">
</head>
<body>
  <main class="page">
    <section class="hero">
      <div class="heroTop">
        <div>
          <span class="kicker" id="viewKicker">Reporting</span>
          <h1 id="viewTitle">Reporting</h1>
          <p class="subtitle" id="viewSubtitle">Choisis une entite pour charger la vue correspondante.</p>
        </div>
        <div class="actions">
          <select class="select" id="viewSelect" aria-label="Type de reporting"></select>
          <select class="select" id="yearSelect" aria-label="Annee active"></select>
          <select class="select" id="entitySelect" aria-label="Entite"></select>
          <a class="btn" href="accreport.html" data-year-link>Accueil reporting</a>
          <button class="btn primary" id="openFullBtn" type="button">Ouvrir plein ecran</button>
        </div>
      </div>
      <div class="optionGrid" id="optionGrid"></div>
    </section>

    <section class="viewer">
      <div class="status" id="viewerStatus">Chargement...</div>
      <iframe id="reportFrame" title="Vue reporting selectionnee"></iframe>
    </section>
  </main>

    <script>
    (function(){
      const DEFAULT_ENTITIES = [
        { key:"psa", label:"PSA" },
        { key:"gueudet", label:"Gueudet" },
        { key:"ford", label:"Ford" },
        { key:"direct", label:"Direct" }
      ];

      const VIEWS = {
        "activite-reelle": {
          kicker: "Activite",
          title: "Activite reelle",
          subtitle: "Choisis une entite : le reel vient directement de Supabase.",
          description: "CA reel importe par client"
        },
        "annuel-budget": {
          kicker: "Budget",
          title: "Reporting annuel vs Budget",
          subtitle: "Compare le reel et le budget actif Supabase pour l'entite choisie.",
          description: "Reel vs budget annuel"
        },
        "evol-reporting": {
          kicker: "Evolution",
          title: "Evol Reporting",
          subtitle: "Analyse mensuelle par entite, avec acces a la vue semaine.",
          description: "Evolution reporting"
        },
        "evol-analyse": {
          kicker: "Analyse",
          title: "Evol Analyse",
          subtitle: "Analyse par entite ou cumul automatique de toutes les entites actives.",
          description: "Analyse mensuelle"
        },
        "reel-n1": {
          kicker: "Comparatif",
          title: "Reel vs N-1",
          subtitle: "Compare les produits de l'annee active avec l'annee precedente.",
          description: "Produits reel vs N-1"
        }
      };

      const VIEW_ORDER = ["activite-reelle", "annuel-budget", "evol-reporting", "evol-analyse", "reel-n1"];
      const VIEW_LABELS = {
        "activite-reelle": "Activite reelle",
        "annuel-budget": "Reporting annuel vs Budget",
        "evol-reporting": "Evol Reporting",
        "evol-analyse": "Evol Analyse",
        "reel-n1": "Reel vs N-1"
      };

      const dom = {
        viewSelect: document.getElementById("viewSelect"),
        yearSelect: document.getElementById("yearSelect"),
        entitySelect: document.getElementById("entitySelect"),
        optionGrid: document.getElementById("optionGrid"),
        frame: document.getElementById("reportFrame"),
        status: document.getElementById("viewerStatus"),
        openFullBtn: document.getElementById("openFullBtn"),
        kicker: document.getElementById("viewKicker"),
        title: document.getElementById("viewTitle"),
        subtitle: document.getElementById("viewSubtitle")
      };

      const params = new URLSearchParams(location.search);
      let currentViewKey = VIEWS[params.get("view")] ? params.get("view") : "activite-reelle";
      let currentOptionKey = normalizeEntityKey(params.get("entityKey") || params.get("entity") || "");
      let entities = DEFAULT_ENTITIES.slice();

      init();

      async function init(){
        KentDataConfig.fillYearSelect(dom.yearSelect, { selectedYear: KentDataConfig.getActiveYear() });
        const urlYear = params.get("year");
        if (urlYear) dom.yearSelect.value = String(KentDataConfig.setActiveYear(Number(urlYear)));

        renderViewSelect();
        entities = await loadEntities();
        if (!currentOptionKey) currentOptionKey = optionsForCurrentView()[0]?.key || "";
        loadSelected();
        bindEvents();
      }

      async function loadEntities(){
        try{
          if (window.ReelSupabase && typeof window.ReelSupabase.listEntities === "function"){
            const rows = await window.ReelSupabase.listEntities();
            const mapped = (rows || []).map(row => ({
              key: normalizeEntityKey(row.key),
              label: row.libelle || row.key || "Entite",
              description: "Entite active Supabase",
              state: "ready"
            })).filter(row => row.key);
            if (mapped.length) return dedupeOptions(mapped);
          }
        }catch(error){
          console.warn("Entites Supabase indisponibles, fallback local:", error.message || error);
        }
        return dedupeOptions(DEFAULT_ENTITIES.map(entity => ({ ...entity, description: "Entite standard", state: "ready" })));
      }

      function activeView(){
        return VIEWS[currentViewKey] || VIEWS["activite-reelle"];
      }

      function activeYear(){
        return Number(dom.yearSelect.value || KentDataConfig.getActiveYear());
      }

      function optionsForCurrentView(){
        const base = dedupeOptions(entities).map(entity => ({
          ...entity,
          page: "reporting-entite.html",
          description: activeView().description,
          state: "ready"
        }));
        if (currentViewKey === "evol-analyse"){
          return base.concat([{ key:"cumul", label:"Cumul", page:"reporting-entite.html", description:"Somme automatique de toutes les entites", state:"ready", isCumul:true }]);
        }
        return base;
      }

      function selectedOption(){
        const options = optionsForCurrentView();
        return options.find(option => option.key === currentOptionKey) || options[0];
      }

      function dedupeOptions(rows){
        const byKey = new Map();
        for (const row of rows || []){
          const key = normalizeEntityKey(row && row.key);
          if (!key || byKey.has(key)) continue;
          byKey.set(key, { ...row, key });
        }
        return Array.from(byKey.values());
      }

      function buildPageUrl(option, year){
        const qs = new URLSearchParams({ year:String(year) });
        if (option && option.isCumul){
          qs.set("view", "evol-cumul");
        }else{
          qs.set("view", currentViewKey);
          qs.set("entityKey", option.key);
          qs.set("entity", option.label);
        }
        return `reporting-entite.html?${qs.toString()}`;
      }

      function syncUrl(){
        const next = new URL(location.href);
        next.searchParams.set("view", currentViewKey);
        next.searchParams.set("entity", selectedOption().key);
        next.searchParams.set("year", String(activeYear()));
        history.replaceState(null, "", next.pathname.split("/").pop() + next.search);
      }

      function renderViewSelect(){
        dom.viewSelect.innerHTML = VIEW_ORDER.map(key => `<option value="${key}">${VIEW_LABELS[key]}</option>`).join("");
        dom.viewSelect.value = currentViewKey;
      }

      function renderHeader(){
        const view = activeView();
        dom.kicker.textContent = view.kicker;
        dom.title.textContent = view.title;
        dom.subtitle.textContent = view.subtitle;
        document.title = `${view.title} - Selecteur`;
      }

      function renderEntitySelect(){
        const options = optionsForCurrentView();
        dom.entitySelect.innerHTML = options.map(option => `<option value="${escapeAttr(option.key)}">${escapeHtml(option.label)}</option>`).join("");
        if (!options.some(option => option.key === currentOptionKey)) currentOptionKey = options[0]?.key || "";
        dom.entitySelect.value = currentOptionKey;
      }

      function renderCards(){
        const option = selectedOption();
        dom.optionGrid.innerHTML = optionsForCurrentView().map(item => {
          const active = item.key === option.key ? " active" : "";
          const tag = item.isCumul ? "Cumul" : "Supabase";
          return `
            <article class="optionCard${active}" data-entity="${escapeAttr(item.key)}">
              <div class="optionName">
                <span>${escapeHtml(item.label)}</span>
                <span class="tag ready">${tag}</span>
              </div>
              <div class="optionMeta">${escapeHtml(item.description || "")}</div>
            </article>
          `;
        }).join("");
      }

      function loadSelected(){
        const year = activeYear();
        KentDataConfig.setActiveYear(year);
        KentDataConfig.applyYearToLinks(document, year);
        renderViewSelect();
        renderHeader();
        renderEntitySelect();
        renderCards();

        const option = selectedOption();
        const src = buildPageUrl(option, year);
        dom.status.hidden = false;
        dom.status.textContent = "Chargement...";
        dom.frame.src = src;
        syncUrl();
      }

      function bindEvents(){
        dom.viewSelect.addEventListener("change", () => {
          currentViewKey = VIEWS[dom.viewSelect.value] ? dom.viewSelect.value : "activite-reelle";
          const options = optionsForCurrentView();
          if (!options.some(option => option.key === currentOptionKey)) currentOptionKey = options[0]?.key || "";
          loadSelected();
        });

        dom.entitySelect.addEventListener("change", () => {
          currentOptionKey = dom.entitySelect.value;
          loadSelected();
        });

        dom.optionGrid.addEventListener("click", event => {
          const card = event.target.closest("[data-entity]");
          if (!card) return;
          currentOptionKey = card.dataset.entity;
          loadSelected();
        });

        dom.yearSelect.addEventListener("change", () => {
          const year = KentDataConfig.setActiveYear(Number(dom.yearSelect.value));
          dom.yearSelect.value = String(year);
          loadSelected();
        });

        dom.openFullBtn.addEventListener("click", () => {
          window.location.href = buildPageUrl(selectedOption(), activeYear());
        });

        dom.frame.addEventListener("load", () => {
          dom.status.textContent = "";
          dom.status.hidden = true;
        });
      }

      function normalizeEntityKey(value){
        return String(value || "").trim().toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[^a-z0-9]+/g, "-").replace(/(^-|-$)/g, "");
      }
      function escapeHtml(value){
        return String(value ?? "").replace(/[&<>"']/g, s => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[s]));
      }
      function escapeAttr(value){ return escapeHtml(value).replace(/"/g, "&quot;"); }
    })();
  </script>
</body>
</html>
