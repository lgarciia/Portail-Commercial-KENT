<html lang="fr" data-theme="dark">
<head>
  <link rel="icon" type="image/svg+xml" href="./kent-logo.svg">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Reporting entite</title>
  <script src="./app-data-config.js"></script>
  <script src="./shared-ui.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
  <script src="./budget-supabase.js"></script>
  <script src="./reel-supabase.js"></script>
  <style>
    :root{
      --bg:#07111f;--panel:rgba(15,23,42,.84);--panel2:rgba(15,23,42,.62);
      --line:rgba(148,163,184,.18);--text:#eef4ff;--muted:rgba(226,232,240,.66);
      --blue:#38bdf8;--green:#22c55e;--gold:#f59e0b;--red:#ef4444;
      --shadow:0 14px 38px rgba(0,0,0,.26);--radius:18px;
    }
    *{box-sizing:border-box}
    html,body{min-height:100%}
    body{
      margin:0;
      font-family:ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      color:var(--text);
      background:
        radial-gradient(980px 700px at 10% -8%, rgba(56,189,248,.18), transparent 58%),
        radial-gradient(900px 680px at 92% 0%, rgba(34,197,94,.13), transparent 55%),
        radial-gradient(860px 720px at 54% 112%, rgba(245,158,11,.08), transparent 58%),
        var(--bg);
    }
    .page{min-height:100vh;padding:12px;display:grid;gap:10px;grid-template-rows:auto auto 1fr}
    .hero,.panel,.modal{
      border:1px solid var(--line);background:linear-gradient(135deg,rgba(15,23,42,.94),rgba(15,23,42,.70));
      box-shadow:var(--shadow);backdrop-filter:blur(14px);border-radius:var(--radius);
    }
    .hero{padding:12px 14px}
    .heroTop{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap}
    .kicker{
      display:inline-flex;align-items:center;gap:8px;border:1px solid rgba(56,189,248,.28);
      background:rgba(56,189,248,.10);color:#d8f3ff;border-radius:999px;padding:4px 9px;
      font-size:10px;font-weight:950;letter-spacing:.12em;text-transform:uppercase;
    }
    .kicker:before{content:"";width:6px;height:6px;border-radius:999px;background:var(--blue);box-shadow:0 0 12px rgba(56,189,248,.55)}
    h1{margin:6px 0 3px;font-size:clamp(21px,2.4vw,32px);line-height:1;letter-spacing:-.045em}
    .subtitle{margin:0;max-width:860px;color:var(--muted);font-size:12px;line-height:1.35;font-weight:750}
    .actions{display:flex;align-items:center;justify-content:flex-end;gap:8px;flex-wrap:wrap}
    .btn,.select,.input{
      min-height:34px;border:1px solid rgba(148,163,184,.22);border-radius:12px;background:rgba(255,255,255,.065);
      color:var(--text);font-weight:950;font-size:12px;padding:0 10px;box-shadow:none;
    }
    .btn{display:inline-flex;align-items:center;justify-content:center;text-decoration:none;cursor:pointer;transition:.16s transform,.16s border-color,.16s background}
    .btn:hover{transform:translateY(-1px);border-color:rgba(56,189,248,.38)}
    .btn.primary{color:#fff;border-color:rgba(56,189,248,.42);background:linear-gradient(135deg,#38bdf8,#2563eb)}
    .btn.gold{color:#111827;border-color:rgba(245,158,11,.38);background:linear-gradient(135deg,#fde68a,#f59e0b)}
    .btn.small{min-height:29px;font-size:11px;padding:0 9px;border-radius:10px}
    .select{min-width:158px;outline:none}
    .input{min-width:240px;outline:none}
    .toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
    .stats{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
    .stat{
      min-height:32px;display:inline-flex;align-items:center;gap:8px;
      border:1px solid rgba(148,163,184,.16);background:rgba(255,255,255,.045);
      border-radius:999px;padding:0 10px;position:relative;overflow:hidden
    }
    .stat:after{display:none}
    .stat .k{color:var(--muted);font-size:10px;font-weight:950;text-transform:uppercase;letter-spacing:.08em}
    .stat .v{margin-top:0;font-size:13px;font-weight:1000;letter-spacing:-.025em}
    .stat.good .v{color:#bbf7d0}.stat.bad .v{color:#fecaca}.stat.gold .v{color:#fde68a}
    .panel{padding:11px;min-height:0}
    .tableWrap{max-height:calc(100vh - 178px);overflow:auto;border:1px solid rgba(148,163,184,.12);border-radius:15px;background:rgba(2,6,23,.36)}
    table{width:100%;border-collapse:separate;border-spacing:0;min-width:1020px;font-size:11px}
    table.annualTable{min-width:2450px}
    th,td{padding:7px 8px;border-bottom:1px solid rgba(148,163,184,.12);border-right:1px solid rgba(148,163,184,.10);white-space:nowrap;vertical-align:middle}
    th{position:sticky;top:0;z-index:2;background:rgba(8,13,23,.94);color:rgba(226,232,240,.82);font-weight:1000;text-align:right}
    th:first-child,td:first-child{text-align:left}
    td{text-align:right;font-variant-numeric:tabular-nums}
    tr:hover td{background:rgba(56,189,248,.045)}
    .left{text-align:left!important}.num{font-weight:950}.muted{color:var(--muted)}
    .pos{color:#86efac}.neg{color:#fca5a5}.zero{color:rgba(226,232,240,.58)}
    .totalRow td{background:rgba(56,189,248,.10);font-weight:1000}
    .globalTotal td{background:rgba(245,158,11,.12);border-top:2px solid rgba(245,158,11,.42);font-weight:1000}
    .mStart{border-left:2px solid rgba(56,189,248,.26)!important}
    .monthBand{background:linear-gradient(135deg,rgba(56,189,248,.15),rgba(255,255,255,.045))!important;color:#d8f3ff}
    .monthBand:nth-of-type(odd){background:linear-gradient(135deg,rgba(34,197,94,.12),rgba(255,255,255,.04))!important}
    .totalBand{background:linear-gradient(135deg,rgba(245,158,11,.20),rgba(255,255,255,.05))!important;color:#fde68a}
    .totalCol{background:rgba(245,158,11,.045)}
    .subHead{font-size:10px;text-transform:uppercase;letter-spacing:.07em;color:rgba(226,232,240,.72)}
    .monthHead{display:flex;align-items:center;justify-content:center;gap:8px}
    body.analysisLite .page{grid-template-rows:auto 1fr;gap:5px;padding-top:8px}
    body.analysisLite .hero{padding:2px 2px;border:0;background:transparent;box-shadow:none;backdrop-filter:none}
    body.analysisLite .heroTop{display:block}
    body.analysisLite .kicker,body.analysisLite .subtitle,body.analysisLite .hero .actions,body.analysisLite .stats,body.analysisLite .toolbar{display:none}
    body.analysisLite h1{margin:0 0 1px;font-size:18px;line-height:1.02;letter-spacing:-.03em}
    body.analysisLite .panel{padding:7px;border-radius:18px}
    body.analysisLite .tableWrap{max-height:calc(100vh - 48px)}
    body.analysisLite .btn.small{min-height:23px;font-size:10px;padding:0 7px;border-radius:9px}
    .analysisMonthTable{width:min(1040px,100%);min-width:760px;margin:0 auto;border-collapse:separate;border-spacing:0 4px;font-size:12px}
    .analysisMonthTable.cumulMonthTable{width:min(1280px,100%)}
    .analysisMonthTable th{border:0;background:transparent;color:rgba(226,232,240,.62);font-size:9px;text-transform:uppercase;letter-spacing:.08em;padding:2px 8px}
    .analysisMonthTable td{border-top:1px solid rgba(148,163,184,.13);border-bottom:1px solid rgba(148,163,184,.13);border-right:0;background:linear-gradient(135deg,rgba(255,255,255,.055),rgba(255,255,255,.025));padding:6px 9px}
    .analysisMonthTable td:first-child{border-left:1px solid rgba(148,163,184,.13);border-radius:11px 0 0 11px}
    .analysisMonthTable td:last-child{border-right:1px solid rgba(148,163,184,.13);border-radius:0 11px 11px 0}
    .analysisMonthTable tr:hover td{background:linear-gradient(135deg,rgba(56,189,248,.105),rgba(255,255,255,.035));border-color:rgba(56,189,248,.22)}
    .analysisMonthTable .totalRow td{background:linear-gradient(135deg,rgba(245,158,11,.16),rgba(255,255,255,.04));border-color:rgba(245,158,11,.30);font-weight:1000}
    .analysisMonthTable .dateRow td{background:linear-gradient(135deg,rgba(56,189,248,.13),rgba(255,255,255,.035));border-color:rgba(56,189,248,.28);font-weight:1000}
    .analysisMonthTable .comment{min-height:24px;font-size:11px;border-radius:8px;padding:0 8px}
    .monthLine{display:flex;align-items:center;justify-content:space-between;gap:8px;font-weight:1000}
    .monthHint{color:var(--muted);font-size:9px;font-weight:900}
    .moneyBar strong{font-size:12px}
    .empty{border:1px solid rgba(148,163,184,.14);background:rgba(255,255,255,.045);border-radius:18px;padding:22px;color:var(--muted);font-weight:850;text-align:center}
    .comment{
      width:100%;min-width:220px;min-height:32px;border:1px solid rgba(148,163,184,.18);border-radius:11px;
      background:rgba(2,6,23,.32);color:var(--text);padding:0 10px;font-weight:800;outline:none;
    }
    .modalOverlay{position:fixed;inset:0;display:none;align-items:center;justify-content:center;padding:22px;background:rgba(2,6,23,.70);z-index:30}
    .modalOverlay.show{display:flex}
    .modal{width:min(1460px,98vw);max-height:92vh;overflow:auto;padding:16px;border-radius:24px}
    .modalHeader{position:sticky;top:-16px;z-index:4;display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin:-16px -16px 12px;padding:15px 16px 12px;background:linear-gradient(180deg,rgba(15,23,42,.98),rgba(15,23,42,.88));border-bottom:1px solid rgba(148,163,184,.12);backdrop-filter:blur(16px)}
    .modalTitle{font-size:22px;font-weight:1000;letter-spacing:-.04em}
    .chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
    .chip{border:1px solid rgba(148,163,184,.16);background:rgba(255,255,255,.06);border-radius:999px;padding:7px 10px;color:var(--muted);font-size:12px;font-weight:900}
    .miniGrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
    .analysisGrid{display:grid;grid-template-columns:minmax(0,1.08fr) minmax(280px,.92fr);gap:12px}
    .analysisCard{border:1px solid rgba(148,163,184,.16);background:rgba(255,255,255,.045);border-radius:16px;padding:13px}
    .analysisHero{position:relative;overflow:hidden;border:1px solid rgba(56,189,248,.18);background:linear-gradient(135deg,rgba(14,165,233,.13),rgba(15,23,42,.74) 46%,rgba(34,197,94,.08));border-radius:20px;padding:14px;margin-bottom:12px}
    .analysisHero:after{content:"";position:absolute;right:-58px;top:-68px;width:180px;height:180px;border-radius:999px;background:rgba(56,189,248,.10)}
    .analysisHeroTop{position:relative;display:flex;align-items:flex-start;justify-content:space-between;gap:14px;flex-wrap:wrap}
    .analysisContext{font-size:12px;color:var(--muted);font-weight:900;margin-top:4px}
    .analysisBadgeRow{position:relative;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:12px}
    .analysisBadge{border:1px solid rgba(148,163,184,.14);background:rgba(2,6,23,.26);border-radius:14px;padding:8px 10px}
    .analysisBadge .k{font-size:9px;color:var(--muted);font-weight:950;text-transform:uppercase;letter-spacing:.08em}
    .analysisBadge .v{font-size:15px;font-weight:1000;margin-top:2px}
    .analysisTop{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;flex-wrap:wrap}
    .analysisTitle{font-size:11px;font-weight:1000;color:rgba(226,232,240,.70);text-transform:uppercase;letter-spacing:.09em}
    .analysisValue{margin-top:5px;font-size:24px;font-weight:1000;letter-spacing:-.04em}
    .analysisMini{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:10px}
    .miniStat{border:1px solid rgba(148,163,184,.12);border-radius:13px;padding:8px;background:rgba(2,6,23,.22)}
    .miniStat .k{font-size:9px;color:var(--muted);font-weight:950;text-transform:uppercase;letter-spacing:.08em}
    .miniStat .v{font-size:14px;font-weight:1000;margin-top:3px}
    .insightBox{margin-top:10px;border:1px solid rgba(56,189,248,.18);background:rgba(56,189,248,.07);border-radius:14px;padding:10px;font-size:12px;font-weight:850;color:rgba(226,232,240,.86);line-height:1.45}
    .bar{height:8px;border-radius:999px;background:rgba(255,255,255,.07);overflow:hidden}
    .fill{height:100%;border-radius:999px;background:linear-gradient(90deg,#38bdf8,#2563eb)}
    .fill.green{background:linear-gradient(90deg,#22c55e,#14b8a6)}
    .fill.gold{background:linear-gradient(90deg,#fde68a,#f59e0b)}
    .listTools{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
    .listTools .input{min-height:32px}
    .clientToolbar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:10px 0 8px;flex-wrap:wrap}
    .microHint{color:var(--muted);font-size:12px;font-weight:850}
    .clientList{display:grid;gap:8px}
    .clientCard,.entityCardMini{border:1px solid rgba(148,163,184,.14);background:rgba(255,255,255,.045);border-radius:15px;overflow:hidden}
    .clientHead,.entityHeadMini{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 12px;cursor:pointer}
    .clientName{font-weight:1000;line-height:1.2}
    .clientMeta{display:flex;gap:7px;flex-wrap:wrap;margin-top:5px;color:var(--muted);font-size:11px;font-weight:850}
    .clientAmount{font-size:15px;font-weight:1000;text-align:right}
    .productPanel{display:none;border-top:1px solid rgba(148,163,184,.12);padding:9px 12px;background:rgba(2,6,23,.22)}
    .clientCard.open .productPanel{display:block}
    .detailLines{width:100%;min-width:0!important;border-collapse:collapse;font-size:12px}
    .detailLines th,.detailLines td{position:static;border:0;border-bottom:1px solid rgba(148,163,184,.10);background:transparent;padding:7px 6px;white-space:nowrap}
    .detailLines th{color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:.08em}
    .detailLines td:first-child,.detailLines th:first-child{text-align:left;white-space:normal}
    .detailLines tr:last-child td{border-bottom:0}
    .productStack{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:8px}
    .productRow{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;padding:9px;border:1px solid rgba(148,163,184,.10);border-radius:13px;background:rgba(15,23,42,.42);font-size:12px}
    .productTitle{font-weight:950;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .productMeta{display:flex;gap:6px;flex-wrap:wrap;margin-top:5px;color:var(--muted);font-size:10px;font-weight:900}
    .productMoney{font-weight:1000;white-space:nowrap;text-align:right}
    .entityGrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:9px;margin-top:12px}
    .entityCardMini{position:relative;padding:12px;cursor:pointer;background:linear-gradient(145deg,rgba(255,255,255,.065),rgba(255,255,255,.028))}
    .entityCardMini:before{content:"";position:absolute;inset:0 auto 0 0;width:3px;background:linear-gradient(180deg,#38bdf8,#22c55e);opacity:.75}
    .entityCardMini:hover,.clientCard:hover{border-color:rgba(56,189,248,.30);background:rgba(56,189,248,.055)}
    .entityTitle{font-weight:1000}
    .entityMetrics{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px;margin-top:9px}
    .entityMetric{border:1px solid rgba(148,163,184,.11);border-radius:12px;padding:7px;background:rgba(2,6,23,.22)}
    .entityMetric .k{font-size:9px;color:var(--muted);font-weight:950;text-transform:uppercase}
    .entityMetric .v{font-size:12px;font-weight:1000;margin-top:2px}
    .cumulProgress{height:7px;border-radius:999px;background:rgba(255,255,255,.08);overflow:hidden;margin-top:10px}
    .cumulProgress span{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,#38bdf8,#22c55e)}
    @media(max-width:900px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.miniGrid,.analysisGrid{grid-template-columns:1fr}.analysisMini,.analysisBadgeRow,.entityMetrics{grid-template-columns:repeat(2,minmax(0,1fr))}.page{padding:12px}.tableWrap{max-height:none}.actions{justify-content:flex-start}.select,.input{width:100%}}
  </style>
  <link rel="stylesheet" href="./shared-theme.css">
</head>
<body>
  <main class="page">
    <section class="hero">
      <div class="heroTop">
        <div>
          <span class="kicker" id="kicker">Reporting</span>
          <h1 id="title">Reporting</h1>
          <p class="subtitle" id="subtitle">Lecture dynamique depuis Supabase.</p>
        </div>
        <div class="actions">
          <select class="select" id="viewSelect"></select>
          <select class="select" id="yearSelect"></select>
          <select class="select" id="entitySelect"></select>
          <a class="btn" id="backBtn" href="reporting-selecteur.html">Selecteur</a>
          <a class="btn primary" id="importBtn" href="import-reel-mensuel.html">Importer reel</a>
        </div>
      </div>
    </section>

    <section class="stats" id="stats"></section>

    <section class="panel">
      <div class="toolbar">
        <div class="actions">
          <input class="input" id="searchInput" placeholder="Filtrer client, produit, code...">
          <button class="btn small" id="reloadBtn" type="button">Recharger</button>
        </div>
        <div class="actions">
          <button class="btn small" id="exportCsvBtn" type="button">CSV</button>
          <button class="btn small" id="exportXlsxBtn" type="button">Excel</button>
        </div>
      </div>
      <div style="height:12px"></div>
      <div class="tableWrap" id="tableWrap">
        <table id="mainTable"></table>
      </div>
      <div class="empty" id="emptyBox" style="display:none;">Aucune donnee disponible pour cette selection.</div>
    </section>
  </main>

  <div class="modalOverlay" id="modalOverlay" aria-hidden="true">
    <div class="modal" role="dialog" aria-modal="true">
      <div class="modalHeader">
        <div>
          <div class="modalTitle" id="modalTitle">Detail</div>
          <div class="muted" id="modalSub"></div>
        </div>
        <button class="btn small" id="modalClose" type="button">Fermer</button>
      </div>
      <div id="modalBody"></div>
    </div>
  </div>

<script>
(async function(){
  const MONTHS = [
    { key:"jan", label:"Janvier", number:1 },
    { key:"feb", label:"Fevrier", number:2 },
    { key:"mar", label:"Mars", number:3 },
    { key:"apr", label:"Avril", number:4 },
    { key:"may", label:"Mai", number:5 },
    { key:"jun", label:"Juin", number:6 },
    { key:"jul", label:"Juillet", number:7 },
    { key:"aug", label:"Aout", number:8 },
    { key:"sep", label:"Septembre", number:9 },
    { key:"oct", label:"Octobre", number:10 },
    { key:"nov", label:"Novembre", number:11 },
    { key:"dec", label:"Decembre", number:12 }
  ];

  const VIEWS = {
    "activite-reelle": { label:"Activite reelle", kicker:"Activite", subtitle:"CA reel importe par client et par mois, sans fichier Excel local." },
    "annuel-budget": { label:"Reporting annuel vs Budget", kicker:"Budget", subtitle:"Comparaison reel / budget actif Supabase, client par client." },
    "evol-reporting": { label:"Evol Reporting", kicker:"Evolution", subtitle:"Evolution mensuelle reel / budget, avec acces semaine." },
    "evol-analyse": { label:"Evol Analyse", kicker:"Analyse", subtitle:"Synthese mensuelle, commentaires et details clients." },
    "reel-n1": { label:"Reel vs N-1", kicker:"Comparatif", subtitle:"Comparaison produits entre l'annee active et l'annee precedente." },
    "evol-cumul": { label:"Evol Cumul", kicker:"Cumul", subtitle:"Somme automatique de toutes les entites actives Supabase." }
  };
  const VIEW_ORDER = ["activite-reelle", "annuel-budget", "evol-reporting", "evol-analyse", "reel-n1", "evol-cumul"];

  const params = new URLSearchParams(location.search);
  let view = VIEWS[params.get("view")] ? params.get("view") : "activite-reelle";
  let year = Number(params.get("year")) || KentDataConfig.getActiveYear();
  KentDataConfig.setActiveYear(year);
  let entityKey = normalizeEntityKey(params.get("entityKey") || params.get("entity") || "");
  let entityLabel = params.get("entity") || "";
  let entities = [];
  let data = null;
  let exportRows = [];

  const el = {
    kicker: document.getElementById("kicker"),
    title: document.getElementById("title"),
    subtitle: document.getElementById("subtitle"),
    viewSelect: document.getElementById("viewSelect"),
    yearSelect: document.getElementById("yearSelect"),
    entitySelect: document.getElementById("entitySelect"),
    backBtn: document.getElementById("backBtn"),
    importBtn: document.getElementById("importBtn"),
    stats: document.getElementById("stats"),
    search: document.getElementById("searchInput"),
    reload: document.getElementById("reloadBtn"),
    exportCsv: document.getElementById("exportCsvBtn"),
    exportXlsx: document.getElementById("exportXlsxBtn"),
    table: document.getElementById("mainTable"),
    tableWrap: document.getElementById("tableWrap"),
    empty: document.getElementById("emptyBox"),
    modal: document.getElementById("modalOverlay"),
    modalClose: document.getElementById("modalClose"),
    modalTitle: document.getElementById("modalTitle"),
    modalSub: document.getElementById("modalSub"),
    modalBody: document.getElementById("modalBody")
  };

  const nf0 = new Intl.NumberFormat("fr-FR", { maximumFractionDigits:0 });
  const nfQty = new Intl.NumberFormat("fr-FR", { maximumFractionDigits:2 });

  await init();

  async function init(){
    renderViewSelect();
    KentDataConfig.fillYearSelect(el.yearSelect, { selectedYear: year });
    el.yearSelect.value = String(year);
    entities = await loadEntities();
    if (view !== "evol-cumul" && !entityKey) entityKey = entities[0]?.key || "psa";
    entityLabel = entityLabel || labelForEntity(entityKey);
    renderEntitySelect();
    bindEvents();
    await refresh();
  }

  function bindEvents(){
    el.viewSelect.addEventListener("change", () => navigate({ view: el.viewSelect.value, entityKey }));
    el.yearSelect.addEventListener("change", () => navigate({ view, entityKey, year: Number(el.yearSelect.value) }));
    el.entitySelect.addEventListener("change", () => navigate({ view, entityKey: el.entitySelect.value }));
    el.reload.addEventListener("click", refresh);
    el.search.addEventListener("input", renderCurrentView);
    el.exportCsv.addEventListener("click", exportCsv);
    el.exportXlsx.addEventListener("click", exportXlsx);
    el.modalClose.addEventListener("click", closeModal);
    el.modal.addEventListener("click", event => { if (event.target === el.modal) closeModal(); });
    window.addEventListener("keydown", event => { if (event.key === "Escape") closeModal(); });
  }

  function navigate(next){
    const nextView = next.view || view;
    const nextYear = next.year || year;
    const nextEntity = normalizeEntityKey(next.entityKey || entityKey);
    const qs = new URLSearchParams({ view: nextView, year: String(nextYear) });
    if (nextView !== "evol-cumul") {
      qs.set("entityKey", nextEntity);
      qs.set("entity", labelForEntity(nextEntity));
    }
    location.href = `reporting-entite.html?${qs.toString()}`;
  }

  async function refresh(){
    closeModal();
    setLoading();
    year = Number(el.yearSelect.value) || year;
    KentDataConfig.setActiveYear(year);
    entityLabel = labelForEntity(entityKey);
    updateHeader();
    try{
      data = view === "evol-cumul" ? await loadCumulData(year) : await loadEntityData(entityKey, entityLabel, year, view);
      renderCurrentView();
    }catch(error){
      console.error(error);
      data = null;
      renderError(error);
    }
  }

  async function loadEntities(){
    try{
      if (window.ReelSupabase && typeof window.ReelSupabase.listEntities === "function"){
        const rows = await window.ReelSupabase.listEntities();
        return (rows || []).map(row => ({
          key: normalizeEntityKey(row.key),
          label: row.libelle || row.key,
          id: row.id
        })).filter(row => row.key);
      }
    }catch(error){
      console.warn("Entites Supabase indisponibles:", error.message || error);
    }
    return [
      { key:"psa", label:"PSA" },
      { key:"gueudet", label:"Gueudet" },
      { key:"ford", label:"Ford" },
      { key:"direct", label:"Direct" }
    ];
  }

  async function loadEntityData(key, label, selectedYear){
    const budgetClients = await loadBudgetClients(key, selectedYear);
    const realRows = await loadRealRows(key, selectedYear);
    const prevRows = view === "reel-n1" ? await loadRealRows(key, selectedYear - 1) : [];
    const clients = buildClientRows(budgetClients, realRows);
    const monthly = computeMonthly(clients);
    const summary = summarizeMonthly(monthly.real, monthly.budget);
    return { type:"entity", key, label, year:selectedYear, budgetClients, realRows, prevRows, clients, monthly, summary };
  }

  async function loadCumulData(selectedYear){
    const rows = [];
    const monthly = { real:new Array(12).fill(0), budget:new Array(12).fill(0) };
    for (const entity of entities){
      const item = await loadEntityData(entity.key, entity.label, selectedYear, "evol-cumul");
      rows.push({
        key: entity.key,
        label: entity.label,
        real: item.monthly.real,
        budget: item.monthly.budget,
        totalReal: sum(item.monthly.real),
        totalBudget: sum(item.monthly.budget),
        clients: item.clients.length,
        clientRows: item.clients,
        realRows: item.realRows
      });
      for (let i=0;i<12;i++){
        monthly.real[i] += item.monthly.real[i] || 0;
        monthly.budget[i] += item.monthly.budget[i] || 0;
      }
    }
    return { type:"cumul", year:selectedYear, entities: rows, monthly, summary: summarizeMonthly(monthly.real, monthly.budget) };
  }

  async function loadBudgetClients(key, selectedYear){
    try{
      if (!window.BudgetSupabase || typeof window.BudgetSupabase.getActiveBudgetData !== "function") return [];
      const result = await window.BudgetSupabase.getActiveBudgetData(key, selectedYear);
      const clients = result?.budgetData?.clients || [];
      return clients.map(client => ({
        key: clientKey(client.nclient, client.name),
        code: String(client.nclient || "").trim(),
        name: String(client.name || "").trim() || "Client",
        budget: MONTHS.map(month => toNumber(client.budget?.[month.key])),
        real: new Array(12).fill(0)
      }));
    }catch(error){
      console.warn("Budget Supabase absent:", key, error.message || error);
      return [];
    }
  }

  async function loadRealRows(key, selectedYear){
    try{
      if (!window.ReelSupabase || typeof window.ReelSupabase.getActiveLinesByEntityYear !== "function") return [];
      const rows = await window.ReelSupabase.getActiveLinesByEntityYear(key, selectedYear);
      return (rows || []).map(row => ({
        monthIndex: Number(row.mois) - 1,
        code: String(row.client_code || "").trim(),
        name: String(row.client_nom || "").trim() || "Client",
        amount: toNumber(row.montant),
        qty: toNumber(row.quantite),
        ref: String(row.reference || "").trim(),
        designation: String(row.designation || "").trim(),
        source: row
      })).filter(row => row.monthIndex >= 0 && row.monthIndex < 12);
    }catch(error){
      console.warn("Reel Supabase absent:", key, selectedYear, error.message || error);
      return [];
    }
  }

  function buildClientRows(budgetClients, realRows){
    const map = new Map();
    for (const client of budgetClients || []){
      map.set(client.key, { ...client, budget: client.budget.slice(), real: new Array(12).fill(0) });
    }
    for (const row of realRows || []){
      if (!row.amount) continue;
      const key = clientKey(row.code, row.name);
      if (!map.has(key)){
        map.set(key, { key, code: row.code, name: row.name, budget: new Array(12).fill(0), real: new Array(12).fill(0), isUnbudgeted:true });
      }
      map.get(key).real[row.monthIndex] += row.amount;
    }
    return Array.from(map.values()).sort((a,b) => (sum(b.real) + sum(b.budget)) - (sum(a.real) + sum(a.budget)));
  }

  function computeMonthly(clients){
    const real = new Array(12).fill(0);
    const budget = new Array(12).fill(0);
    for (const client of clients || []){
      for (let i=0;i<12;i++){
        real[i] += client.real[i] || 0;
        budget[i] += client.budget[i] || 0;
      }
    }
    return { real, budget };
  }

  function summarizeMonthly(real, budget){
    const totalReal = sum(real);
    const totalBudget = sum(budget);
    const ecart = totalReal - totalBudget;
    return { totalReal, totalBudget, ecart, attain: totalBudget ? totalReal / totalBudget : 0 };
  }

  function monthlyTriplet(real, budget, markStart = false, markTotal = false){
    const ecart = (real || 0) - (budget || 0);
    const firstClass = markStart ? " mStart" : "";
    const totalClass = markTotal ? " totalCol" : "";
    return `<td class="num${firstClass}${totalClass}">${fmtMoney(real)}</td><td class="num${totalClass}">${fmtMoney(budget)}</td><td class="num ${ecartClass(ecart)}${totalClass}">${fmtMoney(ecart)}</td>`;
  }

  function buildToDateSummary(realValues, budgetValues, selectedYear){
    const cutoff = lastClosedMonthIndex(selectedYear);
    return buildPeriodSummary(realValues, budgetValues, cutoff, periodLabel(cutoff));
  }

  function buildPeriodSummary(realValues, budgetValues, cutoffIndex, label){
    const safeCutoff = Math.max(-1, Math.min(11, Number(cutoffIndex)));
    const real = safeCutoff >= 0 ? sum((realValues || []).slice(0, safeCutoff + 1)) : 0;
    const budget = safeCutoff >= 0 ? sum((budgetValues || []).slice(0, safeCutoff + 1)) : 0;
    const ecart = real - budget;
    return { real, budget, ecart, attain: budget ? real / budget : 0, label: label || periodLabel(safeCutoff) };
  }

  function lastClosedMonthIndex(selectedYear){
    const now = new Date();
    const currentYear = now.getFullYear();
    if (selectedYear < currentYear) return 11;
    if (selectedYear > currentYear) return -1;
    return Math.max(-1, now.getMonth() - 1);
  }

  function periodLabel(cutoffIndex){
    if (cutoffIndex < 0) return "Aucun mois clos";
    return `Janvier -> ${MONTHS[Math.min(11, cutoffIndex)].label}`;
  }

  function totalStatusText(ecart){
    const value = round(ecart);
    if (value > 0) return `Avance de ${fmtMoney(value)}`;
    if (value < 0) return `Retard de ${fmtMoney(Math.abs(value))}`;
    return "A l'equilibre";
  }

  function analysisSummaryRowHtml(label, summary, withExtraColumns, rowClass){
    const status = totalStatusText(summary.ecart);
    const hint = withExtraColumns ? summary.label : `${summary.label} - ${status}`;
    const extra = withExtraColumns ? `<td class="left" colspan="2">${esc(status)}</td>` : "";
    return `
      <tr class="${escAttr(rowClass || "totalRow")}">
        <td class="left"><div class="monthLine"><span>${esc(label)}</span><span class="monthHint">${esc(hint)}</span></div></td>
        <td class="num">${fmtMoney(summary.real)}</td>
        <td class="num">${fmtMoney(summary.budget)}</td>
        <td class="num ${ecartClass(summary.ecart)}">${fmtSignedMoney(summary.ecart)}</td>
        <td class="num">${fmtPct(summary.attain)}</td>
        ${extra}
      </tr>
    `;
  }

  function paintTable(html, count, tableClass = ""){
    el.table.className = tableClass;
    el.table.innerHTML = html;
    el.empty.style.display = count ? "none" : "block";
    el.tableWrap.style.display = count ? "block" : "none";
  }

  function openWeek(monthKey, monthLabel){
    const qs = new URLSearchParams({
      entityKey,
      entity: entityLabel,
      month: monthKey,
      monthLabel: monthLabel || "",
      year: String(year),
      dateCol: "Date commande"
    });
    location.href = `vue_semaine.html?${qs.toString()}`;
  }

  function openMonthDetail(monthIndex){
    openEntityMonthDetail({
      key: data.key,
      label: data.label,
      clientRows: data.clients,
      realRows: data.realRows,
      real: data.monthly.real,
      budget: data.monthly.budget
    }, monthIndex);
  }

  function openCumulMonthDetail(monthIndex){
    const month = MONTHS[monthIndex];
    const lines = data.entities.map(entity => {
      const real = entity.real[monthIndex] || 0;
      const budget = entity.budget[monthIndex] || 0;
      const ecart = real - budget;
      const clients = buildClientMonthRows(entity.clientRows || [], entity.realRows || [], monthIndex);
      return {
        ...entity,
        real,
        budget,
        ecart,
        attain: budget ? real / budget : 0,
        pctEcart: budget ? ecart / budget : 0,
        activeClients: clients.filter(row => row.real).length
      };
    }).sort((a,b) => Math.abs(b.ecart) - Math.abs(a.ecart));

    const totalReal = sum(lines.map(row => row.real));
    const totalBudget = sum(lines.map(row => row.budget));
    const totalEcart = totalReal - totalBudget;
    const driver = lines.find(row => row.real || row.budget) || null;
    const insight = buildMonthInsight(totalReal, totalBudget, totalEcart, driver?.label);

    const body = `
      ${monthAnalysisHtml({
        title: "Analyse globale",
        real: totalReal,
        budget: totalBudget,
        ecart: totalEcart,
        context: "Auto + toutes entites",
        insight,
        sideTitle: "Contribution a l'ecart",
        sideHtml: contributionHtml(lines)
      })}
      <div class="entityGrid">
        ${lines.map(entity => cumulEntityCardHtml(entity, lines)).join("")}
      </div>
      <div class="insightBox">Clique sur une entite pour ouvrir le detail client, puis clique sur un client pour voir les produits.</div>
    `;

    openModal(`Analyse - ${month.label}`, `${year} - Cumul toutes entites - ${fmtMoney(totalReal)} de CA`, body);
    el.modalBody.querySelectorAll("[data-cumul-entity]").forEach(card => {
      card.addEventListener("click", () => {
        const entity = data.entities.find(item => item.key === card.dataset.cumulEntity);
        if (entity) openEntityMonthDetail(entity, monthIndex, true);
      });
    });
  }

  function openEntityMonthDetail(entity, monthIndex, backToCumul = false){
    const month = MONTHS[monthIndex];
    const rows = buildClientMonthRows(entity.clientRows || [], entity.realRows || [], monthIndex);
    const totalReal = sum(rows.map(row => row.real));
    const totalBudget = sum(rows.map(row => row.budget));
    const totalEcart = totalReal - totalBudget;
    const topClient = rows.find(row => row.real > 0) || rows[0] || null;
    const sideHtml = topClient
      ? topClientsHtml(rows)
      : `<div class="empty">Aucun client avec CA ou budget sur ce mois.</div>`;
    const backBtn = backToCumul
      ? `<button class="btn small" id="backToCumulBtn" type="button">Retour cumul</button>`
      : "";
    const body = `
      ${monthAnalysisHtml({
        title: "Analyse entite",
        real: totalReal,
        budget: totalBudget,
        ecart: totalEcart,
        context: entity.label,
        insight: buildMonthInsight(totalReal, totalBudget, totalEcart, topClient?.name),
        sideTitle: "Top clients du mois",
        sideHtml
      })}
      <div class="clientToolbar">
        <div class="microHint">Detail clients du mois. Clique un client pour ouvrir/fermer ses produits.</div>
        <div>${backBtn}</div>
      </div>
      <div class="clientList" data-client-list>
        ${rows.length ? rows.map(clientMonthCardHtml).join("") : `<div class="empty">Aucune ligne pour ce mois.</div>`}
      </div>
    `;

    openModal(`Detail ${month.label} - ${entity.label}`, `${year} - ${rows.length} client(s) - CA ${fmtMoney(totalReal)}`, body);
    if (backToCumul){
      const btn = document.getElementById("backToCumulBtn");
      if (btn) btn.addEventListener("click", () => openCumulMonthDetail(monthIndex));
    }
    bindClientDrilldown(el.modalBody);
  }

  function openProductDetail(product){
    const current = aggregateProductClients(data.realRows, product);
    const previous = aggregateProductClients(data.prevRows, product);
    const keys = new Set([...current.keys(), ...previous.keys()]);
    const rows = Array.from(keys).map(key => {
      const a = current.get(key) || { name:"", code:"", real:0, qty:0 };
      const b = previous.get(key) || { name:"", code:"", real:0, qty:0 };
      return { name:a.name || b.name, code:a.code || b.code, real:a.real, budget:b.real };
    }).sort((a,b) => b.real - a.real);
    openModal(`Detail produit - ${product}`, `${rows.length} client(s)`, clientRowsHtml(rows, "Client", "Reel", "N-1"));
  }

  function monthAnalysisHtml({ title, real, budget, ecart, context, insight, sideTitle, sideHtml }){
    const attain = budget ? real / budget : 0;
    return `
      <div class="analysisGrid">
        <div class="analysisCard">
          <div class="analysisTop">
            <div>
              <div class="analysisTitle">${esc(title || "Analyse")}</div>
              <div class="analysisValue">${fmtMoney(real)}</div>
              <div class="muted" style="font-weight:850;margin-top:3px">${esc(context || "")}</div>
            </div>
            <div class="chip ${ecartClass(ecart)}">Ecart ${fmtSignedMoney(ecart)}</div>
          </div>
          <div class="analysisMini">
            <div class="miniStat"><div class="k">Realise</div><div class="v">${fmtMoney(real)}</div></div>
            <div class="miniStat"><div class="k">Budget</div><div class="v">${fmtMoney(budget)}</div></div>
            <div class="miniStat"><div class="k">Ecart</div><div class="v ${ecartClass(ecart)}">${fmtSignedMoney(ecart)}</div></div>
            <div class="miniStat"><div class="k">Atteinte</div><div class="v">${fmtPct(attain)}</div></div>
          </div>
          <div class="insightBox">${esc(insight)}</div>
        </div>
        <div class="analysisCard">
          <div class="analysisTitle">${esc(sideTitle || "Detail")}</div>
          <div style="margin-top:10px">${sideHtml || ""}</div>
        </div>
      </div>
    `;
  }

  function cumulEntityCardHtml(entity, lines){
    const weight = weightPct(entity.ecart, lines);
    return `
      <div class="entityCardMini" data-cumul-entity="${escAttr(entity.key)}">
        <div class="entityHeadMini">
          <div>
            <div class="entityTitle">${esc(entity.label)}</div>
            <div class="clientMeta">
              <span>${fmtInt(entity.activeClients)} client(s)</span>
              <span>Atteinte ${fmtPct(entity.attain)}</span>
            </div>
          </div>
          <div class="clientAmount">${fmtMoney(entity.real)}</div>
        </div>
        <div class="entityMetrics">
          <div class="entityMetric"><div class="k">Budget</div><div class="v">${fmtMoney(entity.budget)}</div></div>
          <div class="entityMetric"><div class="k">Ecart</div><div class="v ${ecartClass(entity.ecart)}">${fmtSignedMoney(entity.ecart)}</div></div>
          <div class="entityMetric"><div class="k">Poids</div><div class="v">${weight}%</div></div>
        </div>
      </div>
    `;
  }

  function contributionHtml(lines){
    const active = (lines || []).filter(row => row.real || row.budget);
    if (!active.length) return `<div class="empty">Aucune entite active sur ce mois.</div>`;
    const sumAbsEcart = sumAbs(active.map(row => row.ecart));
    return `
      <div style="display:grid;gap:9px">
        ${active.map(row => {
          const weight = sumAbsEcart ? Math.round(Math.abs(row.ecart) / sumAbsEcart * 100) : 0;
          const fillClass = row.ecart >= 0 ? "green" : "gold";
          return `
            <div>
              <div class="analysisTop" style="margin-bottom:5px">
                <span style="font-weight:950">${esc(row.label)}</span>
                <span class="${ecartClass(row.ecart)}" style="font-weight:1000">${fmtSignedMoney(row.ecart)} (${weight}%)</span>
              </div>
              <div class="bar"><div class="fill ${fillClass}" style="width:${Math.max(4, weight)}%"></div></div>
            </div>
          `;
        }).join("")}
      </div>
    `;
  }

  function topClientsHtml(rows){
    const top = (rows || []).filter(row => row.real).slice(0, 5);
    if (!top.length) return `<div class="empty">Aucun client facture sur ce mois.</div>`;
    return `
      <div style="display:grid;gap:8px">
        ${top.map((row, index) => `
          <div class="entityMetric" style="display:flex;justify-content:space-between;gap:10px;align-items:center">
            <div>
              <div class="k">#${index + 1}</div>
              <div class="v">${esc(row.name)}</div>
            </div>
            <div class="v">${fmtMoney(row.real)}</div>
          </div>
        `).join("")}
      </div>
    `;
  }

  function buildClientMonthRows(clients, realRows, monthIndex){
    const productsByClient = new Map();
    for (const row of realRows || []){
      if (row.monthIndex !== monthIndex) continue;
      const key = clientKey(row.code, row.name);
      if (!productsByClient.has(key)) productsByClient.set(key, []);
      productsByClient.get(key).push(row);
    }

    const map = new Map();
    for (const client of clients || []){
      const real = client.real?.[monthIndex] || 0;
      const budget = client.budget?.[monthIndex] || 0;
      const products = productsByClient.get(client.key) || [];
      if (!real && !budget && !products.length) continue;
      map.set(client.key, {
        key: client.key,
        name: client.name,
        code: client.code,
        real,
        budget,
        products,
        lines: products.length,
        qty: sum(products.map(item => item.qty))
      });
    }

    for (const [key, products] of productsByClient){
      if (map.has(key)) continue;
      const first = products[0] || {};
      map.set(key, {
        key,
        name: first.name || "Client",
        code: first.code || "",
        real: sum(products.map(item => item.amount)),
        budget: 0,
        products,
        lines: products.length,
        qty: sum(products.map(item => item.qty))
      });
    }

    return Array.from(map.values()).sort((a,b) => (b.real || 0) - (a.real || 0) || (b.budget || 0) - (a.budget || 0));
  }

  function clientMonthCardHtml(row){
    const ecart = (row.real || 0) - (row.budget || 0);
    const search = normalizeText(`${row.name} ${row.code}`);
    return `
      <div class="clientCard" data-client-card data-search="${escAttr(search)}" data-amount="${escAttr(row.real || 0)}">
        <div class="clientHead">
          <div>
            <div class="clientName">${esc(row.name || "Client")}</div>
            <div class="clientMeta">
              <span>Compte ${esc(row.code || "-")}</span>
              <span>${fmtInt(row.lines)} ligne(s)</span>
              <span>Qte ${fmtQty(row.qty)}</span>
            </div>
          </div>
          <div>
            <div class="clientAmount">${fmtMoney(row.real)}</div>
            <div class="${ecartClass(ecart)}" style="font-size:11px;font-weight:1000;text-align:right">${fmtSignedMoney(ecart)}</div>
          </div>
        </div>
        <div class="productPanel">${productPanelHtml(row.products)}</div>
      </div>
    `;
  }

  function productPanelHtml(products){
    const rows = aggregateProductRows(products);
    if (!rows.length) return `<div class="muted" style="font-weight:850">Aucun produit detaille pour ce client sur le mois.</div>`;
    return `
      <table class="detailLines">
        <thead><tr><th>Produit</th><th>Ref</th><th>Quantite</th><th>CA</th></tr></thead>
        <tbody>
          ${rows.map(row => `
            <tr>
              <td>${esc(row.product)}</td>
              <td>${esc(row.ref || "-")}</td>
              <td class="num">${fmtQty(row.qty)}</td>
              <td class="num">${fmtMoney(row.amount)}</td>
            </tr>
          `).join("")}
        </tbody>
      </table>
    `;
  }

  function aggregateProductRows(products){
    const map = new Map();
    for (const row of products || []){
      const ref = String(row.ref || "").trim();
      const product = productName(row);
      const key = `${normalizeText(ref)}__${normalizeText(product)}`;
      if (!map.has(key)) map.set(key, { ref, product, qty:0, amount:0, lines:0 });
      const item = map.get(key);
      item.qty += row.qty || 0;
      item.amount += row.amount || 0;
      item.lines += 1;
    }
    return Array.from(map.values()).sort((a,b) => b.amount - a.amount);
  }

  function bindClientDrilldown(root){
    const list = root.querySelector("[data-client-list]");
    if (!list) return;
    const cards = Array.from(list.querySelectorAll("[data-client-card]"));
    const search = root.querySelector("[data-client-search]");
    const sortBtn = root.querySelector("[data-client-sort]");
    let desc = true;

    cards.forEach(card => {
      const head = card.querySelector(".clientHead");
      if (!head) return;
      head.addEventListener("click", () => {
        const wasOpen = card.classList.contains("open");
        cards.forEach(item => item.classList.remove("open"));
        if (!wasOpen) card.classList.add("open");
      });
    });

    function applyFilters(){
      const query = normalizeText(search?.value || "");
      const sorted = cards.slice().sort((a,b) => {
        const av = toNumber(a.dataset.amount);
        const bv = toNumber(b.dataset.amount);
        return desc ? bv - av : av - bv;
      });
      for (const card of sorted){
        const show = !query || String(card.dataset.search || "").includes(query);
        card.style.display = show ? "" : "none";
        list.appendChild(card);
      }
    }

    if (search) search.addEventListener("input", applyFilters);
    if (sortBtn){
      sortBtn.addEventListener("click", () => {
        desc = !desc;
        sortBtn.textContent = `Tri CA: ${desc ? "desc" : "asc"}`;
        applyFilters();
      });
    }
    applyFilters();
  }

  function clientRowsHtml(rows, firstLabel = "Client", realLabel = "Reel", budgetLabel = "Budget"){
    return `
      <div class="tableWrap" style="max-height:60vh">
        <table>
          <thead><tr><th class="left">${esc(firstLabel)}</th><th class="left">Code</th><th>${esc(realLabel)}</th><th>${esc(budgetLabel)}</th><th>Ecart</th></tr></thead>
          <tbody>${rows.map(row => {
            const ecart = (row.real || 0) - (row.budget || 0);
            return `<tr><td class="left">${esc(row.name)}</td><td class="left">${esc(row.code)}</td><td class="num">${fmtMoney(row.real)}</td><td class="num">${fmtMoney(row.budget)}</td><td class="num ${ecartClass(ecart)}">${fmtMoney(ecart)}</td></tr>`;
          }).join("")}</tbody>
        </table>
      </div>`;
  }

  function openModal(title, sub, body){
    el.modalTitle.textContent = title;
    el.modalSub.textContent = sub || "";
    el.modalBody.innerHTML = body || "";
    el.modal.classList.add("show");
    el.modal.setAttribute("aria-hidden", "false");
  }
  function closeModal(){
    el.modal.classList.remove("show");
    el.modal.setAttribute("aria-hidden", "true");
  }

  function aggregateProducts(currentRows, previousRows){
    const map = new Map();
    addRows(currentRows, "real");
    addRows(previousRows, "prev");
    return Array.from(map.values()).sort((a,b) => b.realCA - a.realCA);
    function addRows(rows, type){
      for (const row of rows || []){
        const product = productName(row);
        if (!map.has(product)) map.set(product, { product, realQty:0, realCA:0, prevQty:0, prevCA:0 });
        const item = map.get(product);
        if (type === "real"){
          item.realQty += row.qty || 0;
          item.realCA += row.amount || 0;
        }else{
          item.prevQty += row.qty || 0;
          item.prevCA += row.amount || 0;
        }
      }
    }
  }

  function aggregateProductClients(rows, product){
    const map = new Map();
    for (const row of rows || []){
      if (productName(row) !== product) continue;
      const key = clientKey(row.code, row.name);
      if (!map.has(key)) map.set(key, { name:row.name, code:row.code, real:0, qty:0 });
      map.get(key).real += row.amount || 0;
      map.get(key).qty += row.qty || 0;
    }
    return map;
  }

  function productName(row){
    return String(row.designation || row.ref || "Produit non renseigne").trim() || "Produit non renseigne";
  }

  function setLoading(){
    el.stats.innerHTML = `<div class="stat"><div class="k">Chargement</div><div class="v">...</div></div>`;
    el.table.innerHTML = "";
    el.empty.textContent = "Chargement des donnees Supabase...";
    el.empty.style.display = "block";
    el.tableWrap.style.display = "none";
  }

  function renderError(error){
    el.stats.innerHTML = `<div class="stat bad"><div class="k">Erreur</div><div class="v">KO</div></div>`;
    el.empty.textContent = String(error.message || error || "Erreur inconnue");
    el.empty.style.display = "block";
    el.tableWrap.style.display = "none";
  }

  function filterRows(rows, textGetter){
    const q = normalizeText(el.search.value || "");
    const filtered = !q ? rows.slice() : rows.filter(row => normalizeText(textGetter(row)).includes(q));
    return filtered;
  }

  function exportCsv(){
    if (!exportRows.length) return alert("Aucune donnee a exporter.");
    const headers = Object.keys(exportRows[0]);
    const csv = [headers.join(";")].concat(exportRows.map(row => headers.map(key => csvCell(row[key])).join(";"))).join("\n");
    downloadBlob(new Blob([csv], { type:"text/csv;charset=utf-8" }), exportName("csv"));
  }

  function exportXlsx(){
    if (!exportRows.length) return alert("Aucune donnee a exporter.");
    if (!window.XLSX) return exportCsv();
    const ws = XLSX.utils.json_to_sheet(exportRows);
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, "Reporting");
    const out = XLSX.write(wb, { bookType:"xlsx", type:"array" });
    downloadBlob(new Blob([out], { type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" }), exportName("xlsx"));
  }

  function makeFlatMonthlyRow(name, code, real, budget){
    const row = { Client:name, "N client":code };
    MONTHS.forEach((month, i) => {
      row[month.label] = round(real[i]);
      if (budget) row[`${month.label} budget`] = round(budget[i]);
    });
    row.Total = round(sum(real));
    return row;
  }

  function exportName(ext){
    const scope = view === "evol-cumul" ? "cumul" : entityKey;
    return `${view}_${scope}_${year}.${ext}`;
  }

  function downloadBlob(blob, filename){
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  }

  function labelForEntity(key){
    const found = entities.find(entity => entity.key === normalizeEntityKey(key));
    return found?.label || params.get("entity") || key || "Entite";
  }

  function clientKey(code, name){
    const c = normalizeText(code).replace(/[^a-z0-9]+/g, "");
    const n = normalizeText(name).replace(/[^a-z0-9]+/g, "-");
    return c ? `${c}__${n}` : n || "client";
  }

  function normalizeEntityKey(value){
    return String(value || "").trim().toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[^a-z0-9]+/g, "-").replace(/(^-|-$)/g, "");
  }
  function normalizeText(value){
    return String(value || "").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
  }
  function toNumber(value){
    if (value === null || value === undefined) return 0;
    if (typeof value === "number") return Number.isFinite(value) ? value : 0;
    const parsed = Number(String(value).trim().replace(/\s/g, "").replace(",", "."));
    return Number.isFinite(parsed) ? parsed : 0;
  }
  function sum(values){ return (values || []).reduce((total, value) => total + toNumber(value), 0); }
  function sumAbs(values){ return (values || []).reduce((total, value) => total + Math.abs(toNumber(value)), 0); }
  function round(value){ return Math.round(toNumber(value)); }
  function fmtMoney(value){ return `${nf0.format(round(value))} €`; }
  function fmtSignedMoney(value){ const n = round(value); return `${n > 0 ? "+" : ""}${fmtMoney(n)}`; }
  function fmtInt(value){ return nf0.format(round(value)); }
  function fmtQty(value){ return nfQty.format(toNumber(value)); }
  function fmtPct(value){ return `${nf0.format((toNumber(value) || 0) * 100)}%`; }
  function ecartClass(value){ const n = round(value); return n > 0 ? "pos" : n < 0 ? "neg" : "zero"; }
  function weightPct(value, lines){
    const total = sumAbs((lines || []).map(row => row.ecart));
    return total ? Math.round(Math.abs(toNumber(value)) / total * 100) : 0;
  }
  function buildMonthInsight(real, budget, ecart, driverLabel){
    if (!real && !budget) return "Aucune donnee sur ce mois : rien a analyser pour le moment.";
    if (!budget && real) return `CA realise sans budget charge sur ce mois. Point principal a regarder : ${driverLabel || "client / entite principale"}.`;
    if (ecart > 0) return `Mois au-dessus du budget. L'ecart positif est principalement porte par ${driverLabel || "les meilleures lignes du mois"}.`;
    if (ecart < 0) return `Mois sous budget. Priorite : regarder ${driverLabel || "les clients les plus contributeurs"} et identifier les lignes a relancer.`;
    return "Mois exactement aligne avec le budget : bon point de controle, a surveiller dans la duree.";
  }
  function csvCell(value){
    const raw = String(value ?? "");
    return /[;"\n]/.test(raw) ? `"${raw.replace(/"/g, '""')}"` : raw;
  }
  function readJson(key, fallback){
    try{ const raw = localStorage.getItem(key); return raw ? JSON.parse(raw) : fallback; }catch{ return fallback; }
  }
  function writeJson(key, value){
    try{ localStorage.setItem(key, JSON.stringify(value || {})); }catch{}
  }
  function esc(value){
    return String(value ?? "").replace(/[&<>"']/g, s => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[s]));
  }
  function escAttr(value){ return esc(value).replace(/"/g, "&quot;"); }
})();
</script>
</body>
</html>
