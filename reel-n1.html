<!doctype html>
<html lang="fr" data-theme="dark">
<head>
  <link rel="icon" type="image/svg+xml" href="./kent-logo.svg">
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>R&eacute;el N-1</title>
  <script src="./shared-ui.js"></script>
  <script src="./app-data-config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./commercial-scope.js?v=20260719-reel-n1-table"></script>
  <script src="./budget-supabase.js?v=20260719-reel-n1-table"></script>
  <script src="./reel-supabase.js?v=20260719-reel-n1-table"></script>
  <link rel="stylesheet" href="./shared-theme.css">
  <style>
    :root{
      --bg:#07111f;
      --panel:rgba(15,23,42,.82);
      --panel2:rgba(15,23,42,.62);
      --line:rgba(148,163,184,.18);
      --text:#eef4ff;
      --muted:rgba(226,232,240,.66);
      --blue:#38bdf8;
      --shadow:0 28px 80px rgba(0,0,0,.38);
    }
    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0;
      font-family:ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      color:var(--text);
      background:
        radial-gradient(1000px 720px at 12% -8%, rgba(56,189,248,.18), transparent 58%),
        radial-gradient(900px 680px at 92% 2%, rgba(34,197,94,.13), transparent 55%),
        var(--bg);
      overflow:hidden;
    }
    .page{height:100vh;display:grid;grid-template-rows:auto 1fr;gap:12px;padding:18px;}
    .hero{
      border:1px solid var(--line);
      border-radius:24px;
      background:linear-gradient(135deg,rgba(15,23,42,.95),rgba(15,23,42,.75));
      box-shadow:var(--shadow);
      padding:16px 18px 14px;
    }
    .topLine{display:flex;align-items:center;justify-content:space-between;gap:16px;}
    .kicker{display:inline-flex;align-items:center;gap:8px;border:1px solid rgba(56,189,248,.28);background:rgba(56,189,248,.11);color:#d8f3ff;border-radius:999px;padding:7px 12px;font-size:12px;font-weight:950;letter-spacing:.12em;text-transform:uppercase;white-space:nowrap;}
    h1{margin:8px 0 0;font-size:clamp(28px,3vw,44px);line-height:.95;letter-spacing:-.06em;}
    .actions{display:flex;align-items:center;gap:10px;justify-content:flex-end;flex-wrap:nowrap;}
    .btn,.select{height:40px;border:1px solid rgba(148,163,184,.20);border-radius:14px;background:rgba(255,255,255,.07);color:var(--text);font-weight:950;font-size:14px;padding:0 13px;box-shadow:0 14px 34px rgba(0,0,0,.20);}
    .btn{display:inline-flex;align-items:center;justify-content:center;text-decoration:none;cursor:pointer;white-space:nowrap;}
    .btn.primary{color:#fff;border-color:rgba(56,189,248,.38);background:linear-gradient(135deg,#38bdf8,#2563eb);}
    .select{min-width:150px;outline:none;cursor:pointer;}
    .entityRail{display:flex;gap:8px;overflow-x:auto;padding:12px 2px 0;scrollbar-width:thin;}
    .entityChip{border:1px solid rgba(148,163,184,.16);border-radius:999px;background:rgba(255,255,255,.055);color:var(--text);padding:8px 13px;font-weight:950;cursor:pointer;white-space:nowrap;}
    .entityChip.active{border-color:rgba(56,189,248,.58);background:rgba(56,189,248,.15);}
    .tablePanel{min-height:0;border:1px solid var(--line);border-radius:24px;background:rgba(2,6,23,.48);box-shadow:var(--shadow);overflow:hidden;display:grid;grid-template-rows:auto 1fr;}
    .tableHead{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 16px;border-bottom:1px solid var(--line);}
    .tableTitle{font-size:18px;font-weight:950;letter-spacing:-.04em;white-space:nowrap;}
    .tableInfo{color:var(--muted);font-size:13px;font-weight:850;white-space:nowrap;}
    .tableWrap{min-height:0;overflow:auto;padding:10px 12px 14px;}
    table{width:100%;min-width:1180px;border-collapse:separate;border-spacing:0 6px;font-size:12.5px;}
    th{position:sticky;top:0;z-index:2;background:#07111f;color:rgba(226,232,240,.70);text-align:left;padding:9px 8px;font-size:11px;text-transform:uppercase;letter-spacing:.08em;border-bottom:1px solid rgba(148,163,184,.16);}
    th:first-child{left:0;z-index:3;min-width:260px;}
    th:nth-child(2){min-width:125px;}
    td{padding:8px;background:rgba(255,255,255,.055);border-top:1px solid rgba(148,163,184,.12);border-bottom:1px solid rgba(148,163,184,.12);font-weight:800;white-space:nowrap;}
    td:first-child{position:sticky;left:0;z-index:1;background:#101b2d;border-left:1px solid rgba(148,163,184,.12);border-radius:12px 0 0 12px;min-width:260px;max-width:360px;white-space:normal;}
    td:last-child{border-right:1px solid rgba(148,163,184,.12);border-radius:0 12px 12px 0;font-weight:950;color:#e0f2fe;}
    .num{text-align:right;}
    .totalRow td{background:rgba(56,189,248,.12);font-weight:950;color:#e0f2fe;}
    .clientName{font-weight:950;line-height:1.25;}
    .muted{color:rgba(226,232,240,.55);font-size:11px;font-weight:800;}
    .empty{margin:18px;border:1px dashed rgba(148,163,184,.26);border-radius:18px;padding:24px;color:var(--muted);font-weight:850;text-align:center;}
    html[data-theme="light"] body{background:#f6f7fb;color:#0f172a;}
    html[data-theme="light"] .hero,html[data-theme="light"] .tablePanel{background:rgba(255,255,255,.88);color:#0f172a;border-color:rgba(15,23,42,.10);box-shadow:0 24px 60px rgba(15,23,42,.12);}
    html[data-theme="light"] th{background:#f6f7fb;color:rgba(15,23,42,.58)}
    html[data-theme="light"] td{background:rgba(255,255,255,.82);border-color:rgba(15,23,42,.10)}
    html[data-theme="light"] td:first-child{background:#fff;}
    @media (max-width:1100px){body{overflow:auto}.page{height:auto;min-height:100vh}.topLine{align-items:flex-start;flex-direction:column}.actions{flex-wrap:wrap;justify-content:flex-start}.tablePanel{min-height:70vh}}
  </style>
</head>
<body>
  <main class="page">
    <section class="hero">
      <div class="topLine">
        <div>
          <span class="kicker">R&eacute;el N-1</span>
          <h1>Activit&eacute; r&eacute;elle</h1>
        </div>
        <div class="actions">
          <select class="select" id="yearSelect" aria-label="Ann&eacute;e active"></select>
        </div>
      </div>
      <div class="entityRail" id="entityRail"></div>
    </section>

    <section class="tablePanel">
      <div class="tableHead">
        <div class="tableTitle" id="tableTitle">Chargement...</div>
        <div class="tableInfo" id="tableInfo">-</div>
      </div>
      <div class="tableWrap">
        <table id="table" hidden>
          <thead id="thead"></thead>
          <tbody id="tbody"></tbody>
        </table>
        <div class="empty" id="empty">Chargement des donn&eacute;es...</div>
      </div>
    </section>
  </main>

  <script>
  (function(){
    const DEFAULT_ENTITIES = [
      { key:"psa", label:"PSA" },
      { key:"gueudet", label:"Gueudet" },
      { key:"ford", label:"Ford" },
      { key:"direct", label:"Direct" }
    ];
    const MONTH_LABELS = ["Janvier","Février","Mars","Avril","Mai","Juin","Juillet","Août","Septembre","Octobre","Novembre","Décembre"];
    const params = new URLSearchParams(location.search);
    const dom = {
      yearSelect:document.getElementById("yearSelect"),
      entityRail:document.getElementById("entityRail"),
      tableTitle:document.getElementById("tableTitle"),
      tableInfo:document.getElementById("tableInfo"),
      table:document.getElementById("table"),
      thead:document.getElementById("thead"),
      tbody:document.getElementById("tbody"),
      empty:document.getElementById("empty")
    };
    let entities = DEFAULT_ENTITIES.slice();
    let selectedKey = String(params.get("entity") || "psa").toLowerCase();

    function esc(value){return String(value ?? "").replace(/[&<>"']/g, ch => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[ch]));}
    function money(value){return Number(value || 0).toLocaleString("fr-FR", { style:"currency", currency:"EUR", maximumFractionDigits:0 });}
    function activeYear(){return Number(dom.yearSelect.value || KentDataConfig.getActiveYear());}
    function previousYear(){return activeYear() - 1;}
    function selectedEntity(){return entities.find(entity => entity.key === selectedKey) || entities[0] || DEFAULT_ENTITIES[0];}
    function dedupeEntities(rows){
      const byKey = new Map();
      for (const row of rows || []) {
        const key = String(row.key || "").trim().toLowerCase();
        if (!key || byKey.has(key)) continue;
        byKey.set(key, { ...row, key });
      }
      return Array.from(byKey.values());
    }

    async function loadEntities(){
      try{
        if (window.ReelSupabase && typeof window.ReelSupabase.listEntities === "function") {
          const rows = await window.ReelSupabase.listEntities();
          const mapped = (rows || []).map(row => ({ key:String(row.key || "").trim().toLowerCase(), label:row.libelle || row.key || "Entite" })).filter(row => row.key);
          if (mapped.length) entities = dedupeEntities(mapped);
        }
      }catch(error){console.warn("Entités N-1 indisponibles:", error?.message || error);}
      entities = dedupeEntities(entities);
      if (!entities.some(entity => entity.key === selectedKey)) selectedKey = entities[0]?.key || "psa";
    }

    function renderSelectors(){
      dom.entityRail.innerHTML = entities.map(entity => `<button class="entityChip ${entity.key === selectedKey ? "active" : ""}" type="button" data-entity="${esc(entity.key)}">${esc(entity.label)}</button>`).join("");
    }

    function aggregateRows(rows){
      const clients = new Map();
      const totals = Array.from({length:12}, () => 0);
      for (const row of rows || []) {
        const monthIndex = Number(row?.mois || 0) - 1;
        if (monthIndex < 0 || monthIndex > 11) continue;
        const amount = Number(row?.montant || 0);
        const code = String(row?.client_code || "").trim();
        const name = String(row?.client_nom || "Client inconnu").trim() || "Client inconnu";
        const key = `${code}__${name}`.toLowerCase();
        if (!clients.has(key)) clients.set(key, { code, name, months:Array.from({length:12}, () => 0), total:0 });
        const client = clients.get(key);
        client.months[monthIndex] += amount;
        client.total += amount;
        totals[monthIndex] += amount;
      }
      const total = totals.reduce((sum, value) => sum + Number(value || 0), 0);
      return { clients:Array.from(clients.values()).sort((a,b) => b.total - a.total), totals, total };
    }

    function renderTable(data){
      const { clients, totals, total } = data;
      dom.thead.innerHTML = `<tr><th>Client</th><th>N compte</th>${MONTH_LABELS.map(month => `<th class="num">${esc(month)}</th>`).join("")}<th class="num">Total</th></tr>`;
      const totalRow = `<tr class="totalRow"><td>Total</td><td>-</td>${totals.map(value => `<td class="num">${value ? esc(money(value)) : "-"}</td>`).join("")}<td class="num">${esc(money(total))}</td></tr>`;
      const clientRows = clients.map(client => `<tr><td><div class="clientName">${esc(client.name)}</div></td><td>${esc(client.code || "-")}</td>${client.months.map(value => `<td class="num">${value ? esc(money(value)) : "-"}</td>`).join("")}<td class="num">${esc(money(client.total))}</td></tr>`).join("");
      dom.tbody.innerHTML = totalRow + clientRows;
      dom.table.hidden = !clients.length;
      dom.empty.style.display = clients.length ? "none" : "block";
      dom.empty.textContent = "Aucune donnée.";
    }

    async function loadView(){
      const entity = selectedEntity();
      const year = activeYear();
      const prev = previousYear();
      KentDataConfig.setActiveYear(year);
      renderSelectors();
      dom.tableTitle.textContent = entity.label;
      dom.tableInfo.textContent = "Chargement...";
      dom.table.hidden = true;
      dom.empty.style.display = "block";
      dom.empty.textContent = "Chargement des données...";
      try{
        if (!window.ReelSupabase || typeof window.ReelSupabase.getActiveLinesByEntityYear !== "function") throw new Error("Module Reel Supabase indisponible.");
        const rows = await window.ReelSupabase.getActiveLinesByEntityYear(entity.key, prev);
        const data = aggregateRows(rows || []);
        renderTable(data);
        dom.tableInfo.textContent = `${data.clients.length.toLocaleString("fr-FR")} client(s) - ${money(data.total)}`;
      }catch(error){
        console.error(error);
        dom.table.hidden = true;
        dom.empty.style.display = "block";
        dom.empty.textContent = `Impossible de charger le réel N-1 : ${error?.message || error}`;
        dom.tableInfo.textContent = "Erreur";
      }
    }

    async function init(){
      KentDataConfig.fillYearSelect(dom.yearSelect, { selectedYear: KentDataConfig.getActiveYear() });
      const urlYear = params.get("year");
      if (urlYear) dom.yearSelect.value = String(KentDataConfig.setActiveYear(Number(urlYear)));
      await loadEntities();
      await loadView();
    }

    dom.entityRail.addEventListener("click", event => {
      const btn = event.target.closest("[data-entity]");
      if (!btn) return;
      selectedKey = btn.dataset.entity;
      loadView();
    });
    dom.yearSelect.addEventListener("change", () => { dom.yearSelect.value = String(KentDataConfig.setActiveYear(Number(dom.yearSelect.value))); loadView(); });
    init();
  })();
  </script>
</body>
</html>
