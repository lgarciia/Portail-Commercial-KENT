<!doctype html>
<html lang="fr" data-theme="dark">
<head>
  <link rel="icon" type="image/svg+xml" href="./kent-logo.svg">
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Vue semaine</title>
  <script src="./shared-ui.js"></script>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./budget-supabase.js"></script>
  <script src="./reel-supabase.js"></script>

    <style>
    :root{
      --bg:#0b0f17;
      --panel:rgba(255,255,255,0.06);
      --stroke:rgba(255,255,255,0.10);
      --text:rgba(255,255,255,0.92);
      --muted:rgba(255,255,255,0.62);
      --good:rgba(95,255,160,0.92);
      --bad:rgba(255,110,110,0.92);
      --warn:rgba(255,199,97,0.92);
      --shadow:0 16px 40px rgba(0,0,0,0.35);
      --r:18px;
      --font: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
    }
    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0;
      font-family:var(--font);
      background:
        radial-gradient(1200px 700px at 20% -10%, rgba(90,140,255,0.15), transparent 60%),
        radial-gradient(1100px 800px at 110% 20%, rgba(255,120,200,0.10), transparent 55%),
        radial-gradient(900px 700px at 60% 110%, rgba(130,255,200,0.08), transparent 55%),
        var(--bg);
      color:var(--text);
      overflow:hidden;
    }

    .app{height:100%;display:flex;flex-direction:column}
    .topbar{
      display:flex;align-items:center;justify-content:space-between;gap:12px;
      padding:14px 18px;
      border-bottom:1px solid var(--stroke);
      background: linear-gradient(to bottom, rgba(255,255,255,0.06), rgba(255,255,255,0.03));
      backdrop-filter: blur(10px);
    }
    .brand{display:flex;align-items:center;gap:12px}
    .logo{
      width:38px;height:38px;border-radius:14px;
      background: linear-gradient(135deg, rgba(132,182,255,0.95), rgba(120,255,195,0.55));
      box-shadow: 0 10px 22px rgba(0,0,0,0.35);
      border:1px solid rgba(255,255,255,0.15);
    }
    .titleWrap{display:flex;flex-direction:column;line-height:1.15}
    .title{font-weight:900;font-size:16px}
    .subtitle{font-size:13px;color:var(--muted);margin-top:2px}

    .btn{
      height:38px;padding:0 16px;border-radius:999px;
      border:1px solid rgba(255,255,255,0.12);
      background:rgba(255,255,255,0.06);
      color:rgba(255,255,255,0.90);
      font-weight:900;cursor:pointer;transition:.12s;
    }
    .btn:hover{background:rgba(255,255,255,0.10);transform:translateY(-1px)}
    .btn:active{transform:translateY(0)}
    .btn.primary{background:rgba(132,182,255,0.18);border-color:rgba(132,182,255,0.28)}

    .shell{
      height: calc(100% - 67px);
      padding:16px 16px 18px;
      display:grid;
      grid-template-rows: auto 1fr;
      gap:12px;
      min-height:0;
    }
    .card{
      border:1px solid var(--stroke);
      background: linear-gradient(to bottom, rgba(255,255,255,0.06), rgba(255,255,255,0.03));
      border-radius:var(--r);
      box-shadow:var(--shadow);
      backdrop-filter: blur(12px);
      overflow:hidden;
      min-height:0;
    }
    .status{
      padding:12px 14px;
      display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;
      border-bottom:1px solid var(--stroke);
      background:rgba(0,0,0,0.14);
    }
    .chip{
      display:inline-flex;align-items:center;gap:10px;height:38px;padding:0 14px;border-radius:999px;
      border:1px solid rgba(255,255,255,0.12);
      background:rgba(255,255,255,0.05);
      font-size:13px;color:rgba(255,255,255,0.70);
    }
    .chip b{color:rgba(255,255,255,0.92)}
    .dot{width:9px;height:9px;border-radius:999px;background:rgba(255,255,255,0.28)}
    .dot.ok{background:var(--good)}
    .dot.warn{background:var(--warn)}
    .dot.bad{background:var(--bad)}

    .tableWrap{flex:1;min-height:0;overflow:auto;background:rgba(0,0,0,0.10)}
    table{border-collapse:separate;border-spacing:0;width:100%;min-width:980px;font-size:12px}
    thead th{
      position:sticky;top:0;z-index:3;
      background:rgba(10,15,23,0.92);backdrop-filter: blur(8px);
      border-bottom:1px solid rgba(255,255,255,0.10);
      font-weight:900;color:rgba(255,255,255,0.84);
      padding:10px 10px;
      text-align:right;
    }
    thead th:first-child, tbody td:first-child{ text-align:left; }
    th,td{
      padding:10px 10px;border-bottom:1px solid rgba(255,255,255,0.08);
      border-right:1px solid rgba(255,255,255,0.08);
      white-space:nowrap;
      font-variant-numeric:tabular-nums;
      vertical-align:middle;
    }
    td.num{ text-align:right; font-weight:900; }
    .pos{ color:var(--good); }
    .neg{ color:var(--bad); }
    .zero{ color:rgba(255,255,255,0.60); }
    .rowTotal td{
      background: rgba(132,182,255,0.10);
      border-bottom: 1px solid rgba(132,182,255,0.20);
      font-weight:950;
    }

    /* âœ… colonne commentaire */
    .cmt{
      width:100%;
      min-width:320px;
      height:34px;
      border-radius:12px;
      border:1px solid rgba(255,255,255,0.12);
      background: rgba(0,0,0,0.22);
      color: var(--text);
      padding:0 10px;
      outline:none;
      font-weight:800;
      font-size:12px;
    }
    .cmt:focus{
      border-color: rgba(132,182,255,0.35);
      box-shadow: 0 0 0 4px rgba(132,182,255,0.10);
    }
  </style>
  <link rel="stylesheet" href="./shared-theme.css">
</head>

<body>
<div class="app">
  <div class="topbar">
    <div class="brand">
      <div class="logo"></div>
      <div class="titleWrap">
        <div class="title" id="tTitle">Vue semaine</div>
        <div class="subtitle" id="tSub">-</div>
      </div>
    </div>
    <div style="display:flex;gap:12px;flex-wrap:wrap;align-items:center;">
      <button class="btn" id="btnBack">Retour</button>
      <button class="btn primary" id="btnReload">Recharger</button>
    </div>
  </div>

  <div class="shell">
    <div class="card">
      <div class="status">
        <div style="display:flex;gap:12px;flex-wrap:wrap;align-items:center;">
          <div class="chip"><span class="dot" id="dotBudget"></span>Budget Supabase : <b id="sBudget">-</b></div>
          <div class="chip"><span class="dot" id="dotReel"></span>Réel Supabase : <b id="sReel">-</b></div>
          <div class="chip">Mois : <b id="sMonth">-</b></div>
          <div class="chip">Budget semaine = <b id="sBw">-</b></div>
        </div>
        <div class="chip" id="debugLine" style="max-width:100%;overflow:hidden;text-overflow:ellipsis;">-</div>
      </div>

      <div class="tableWrap">
        <table id="weekTable"></table>
      </div>
    </div>
  </div>
</div>

<script>
(async function(){
  const qs = new URLSearchParams(location.search);

  const MONTHS = [
    { key:"jan", label:"Janvier", number:1 },
    { key:"feb", label:"Fevrier", number:2 },
    { key:"mar", label:"Mars", number:3 },
    { key:"apr", label:"Avril", number:4 },
    { key:"may", label:"Mai", number:5 },
    { key:"jun", label:"Juin", number:6 },
    { key:"jul", label:"Juillet", number:7 },
    { key:"aug", label:"Aout", number:8 },
    { key:"sep", label:"Septembre", number:9 },
    { key:"oct", label:"Octobre", number:10 },
    { key:"nov", label:"Novembre", number:11 },
    { key:"dec", label:"Decembre", number:12 },
  ];

  const entityLabel = qs.get("entity") || "Entité";
  const entityKey = normalizeEntityKey(qs.get("entityKey") || entityLabel);
  const year = Number(qs.get("year") || new Date().getFullYear());
  const monthKey = (qs.get("month") || "jan").toLowerCase();
  const month = MONTHS.find(item => item.key === monthKey) || MONTHS[0];
  const monthLabel = qs.get("monthLabel") || month.label;

  const el = {
    tTitle: document.getElementById("tTitle"),
    tSub: document.getElementById("tSub"),
    sMonth: document.getElementById("sMonth"),
    dotBudget: document.getElementById("dotBudget"),
    dotReel: document.getElementById("dotReel"),
    sBudget: document.getElementById("sBudget"),
    sReel: document.getElementById("sReel"),
    sBw: document.getElementById("sBw"),
    debugLine: document.getElementById("debugLine"),
    table: document.getElementById("weekTable"),
    btnBack: document.getElementById("btnBack"),
    btnReload: document.getElementById("btnReload"),
  };

  const nf0 = new Intl.NumberFormat("fr-FR", { maximumFractionDigits:0 });
  const COMMENT_KEY = `WEEK_VIEW_COMMENTS_${slug(entityKey)}_${year}_${month.key}`;

  el.tTitle.textContent = `Vue semaine - ${entityLabel}`;
  el.tSub.textContent = "Source Supabase : budget actif + réel actif";
  el.sMonth.textContent = `${monthLabel} ${year}`;

  el.btnBack.addEventListener("click", () => history.back());
  el.btnReload.addEventListener("click", () => run());

  await run();

  async function run(){
    setDot(el.dotBudget, "warn");
    setDot(el.dotReel, "warn");
    el.sBudget.textContent = "chargement...";
    el.sReel.textContent = "chargement...";
    el.sBw.textContent = "-";
    el.debugLine.textContent = "Supabase en cours de lecture...";

    let budgetMonth = 0;
    try{
      budgetMonth = await loadBudgetMonthTotal();
      setDot(el.dotBudget, budgetMonth ? "ok" : "warn");
      el.sBudget.textContent = nf0.format(Math.round(budgetMonth));
    }catch(err){
      console.error(err);
      setDot(el.dotBudget, "bad");
      el.sBudget.textContent = "erreur";
    }

    const budgetWeek = budgetMonth / 4;
    el.sBw.textContent = nf0.format(Math.round(budgetWeek));

    let realInfo = { weekly:[0,0,0,0], undated:0, usedLines:0, undatedLines:0, total:0 };
    try{
      realInfo = await loadWeeklyReal();
      setDot(el.dotReel, "ok");
      el.sReel.textContent = nf0.format(Math.round(realInfo.total));
      el.debugLine.textContent = `Réel Supabase OK - ${realInfo.usedLines} ligne(s)` + (realInfo.undatedLines ? ` - ${realInfo.undatedLines} ligne(s) sans date` : "");
    }catch(err){
      console.error(err);
      setDot(el.dotReel, "bad");
      el.sReel.textContent = "erreur";
      el.debugLine.textContent = `Réel Supabase KO - ${String(err.message || err)}`;
    }

    renderTable(realInfo, budgetWeek);
    bindComments();
  }

  async function loadBudgetMonthTotal(){
    if (!window.BudgetSupabase || typeof window.BudgetSupabase.getActiveBudgetData !== "function") {
      throw new Error("Budget Supabase indisponible.");
    }
    const result = await window.BudgetSupabase.getActiveBudgetData(entityKey, year);
    const clients = result?.budgetData?.clients || [];
    if (!clients.length) return 0;

    return clients.reduce((sum, client) => {
      const value = client?.budget?.[month.key];
      return sum + toNumber(value);
    }, 0);
  }

  async function loadWeeklyReal(){
    if (!window.ReelSupabase || typeof window.ReelSupabase.getActiveLinesByEntityYear !== "function") {
      throw new Error("Réel Supabase indisponible.");
    }
    const rows = await window.ReelSupabase.getActiveLinesByEntityYear(entityKey, year);
    const weekly = [0,0,0,0];
    let undated = 0;
    let usedLines = 0;
    let undatedLines = 0;

    for (const row of rows || []){
      if (Number(row.mois) !== month.number) continue;
      const amount = toNumber(row.montant);
      if (!amount) continue;

      const dt = parseIsoDate(row.date_piece);
      if (dt) weekly[weekBucket(dt)] += amount;
      else {
        undated += amount;
        undatedLines += 1;
      }
      usedLines += 1;
    }

    const total = weekly.reduce((sum, value) => sum + value, 0) + undated;
    return { weekly, undated, usedLines, undatedLines, total };
  }

  function renderTable(realInfo, budgetWeek){
    const wReal = realInfo.weekly || [0,0,0,0];
    const rows = [0,1,2,3].map(index => ({
      key: `w${index + 1}`,
      label: `Semaine ${index + 1}`,
      real: wReal[index] || 0,
      budget: budgetWeek,
    }));

    if (realInfo.undated){
      rows.push({ key:"undated", label:"Sans date", real: realInfo.undated, budget:0 });
    }

    const cmts = loadComments();
    const totalReal = rows.reduce((sum, row) => sum + row.real, 0);
    const totalBudget = budgetWeek * 4;
    const totalEcart = totalReal - totalBudget;

    el.table.innerHTML = `
      <thead>
        <tr>
          <th>Semaine</th>
          <th>Réel</th>
          <th>Budget</th>
          <th>Écart</th>
          <th style="text-align:left">Commentaire</th>
        </tr>
      </thead>
      <tbody>
        ${rows.map(row => {
          const ecart = row.real - row.budget;
          return `
            <tr>
              <td>${esc(row.label)}</td>
              <td class="num">${fmt(row.real)}</td>
              <td class="num">${fmt(row.budget)}</td>
              <td class="num ${ecartClass(ecart)}">${fmt(ecart)}</td>
              <td style="text-align:left">
                <input class="cmt" data-cmt="${escAttr(row.key)}" placeholder="Note ${escAttr(row.label.toLowerCase())}..." value="${escAttr(cmts[row.key] || "")}">
              </td>
            </tr>
          `;
        }).join("")}
        <tr class="rowTotal">
          <td>Cumul</td>
          <td class="num">${fmt(totalReal)}</td>
          <td class="num">${fmt(totalBudget)}</td>
          <td class="num ${ecartClass(totalEcart)}">${fmt(totalEcart)}</td>
          <td style="text-align:left">
            <input class="cmt" data-cmt="cum" placeholder="Note cumul..." value="${escAttr(cmts.cum || "")}">
          </td>
        </tr>
      </tbody>
    `;

    function fmt(v){ return nf0.format(Math.round(Number(v)||0)); }
  }

  function bindComments(){
    el.table.querySelectorAll("input[data-cmt]").forEach(inp => {
      inp.addEventListener("input", () => {
        const key = inp.getAttribute("data-cmt");
        const data = loadComments();
        data[key] = inp.value || "";
        saveComments(data);
      });
    });
  }

  function loadComments(){
    try{
      const raw = localStorage.getItem(COMMENT_KEY);
      return raw ? JSON.parse(raw) : {};
    }catch{ return {}; }
  }

  function saveComments(obj){
    try{ localStorage.setItem(COMMENT_KEY, JSON.stringify(obj || {})); }catch{}
  }

  function normalizeEntityKey(value){
    const normalized = slug(value);
    const aliases = {
      psa:"psa",
      gueudet:"gueudet",
      ford:"ford",
      direct:"direct",
      gd:"gueudet",
      floraldirect:"direct",
      "floral-direct":"direct"
    };
    return aliases[normalized] || normalized || "psa";
  }

  function parseIsoDate(value){
    if (!value && value !== 0) return null;
    if (value instanceof Date && !Number.isNaN(value.getTime())) return value;
    const raw = String(value || "").trim();
    if (!raw) return null;

    const iso = raw.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
    if (iso){
      const date = new Date(Number(iso[1]), Number(iso[2]) - 1, Number(iso[3]));
      return Number.isNaN(date.getTime()) ? null : date;
    }

    const fr = raw.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})/);
    if (fr){
      const yearValue = Number(fr[3]) < 100 ? 2000 + Number(fr[3]) : Number(fr[3]);
      const date = new Date(yearValue, Number(fr[2]) - 1, Number(fr[1]));
      return Number.isNaN(date.getTime()) ? null : date;
    }

    const timestamp = Date.parse(raw);
    return Number.isNaN(timestamp) ? null : new Date(timestamp);
  }

  function weekBucket(date){
    const day = date.getDate();
    if (day <= 7) return 0;
    if (day <= 14) return 1;
    if (day <= 21) return 2;
    return 3;
  }

  function toNumber(value){
    if (value === null || value === undefined) return 0;
    if (typeof value === "number") return Number.isFinite(value) ? value : 0;
    const parsed = Number(String(value).trim().replace(/\s/g, "").replace(",", "."));
    return Number.isFinite(parsed) ? parsed : 0;
  }

  function ecartClass(value){
    const n = Math.round(Number(value)||0);
    if (n > 0) return "pos";
    if (n < 0) return "neg";
    return "zero";
  }

  function setDot(dotEl, type){
    dotEl.className = "dot " + (type === "ok" ? "ok" : type === "bad" ? "bad" : "warn");
  }

  function esc(str){
    return String(str ?? "").replace(/[&<>"']/g, s => ({
      "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;"
    }[s]));
  }

  function escAttr(str){ return esc(str).replace(/"/g, "&quot;"); }

  function slug(str){
    return String(str || "")
      .trim()
      .toLowerCase()
      .normalize("NFD").replace(/[\u0300-\u036f]/g, "")
      .replace(/[^a-z0-9]+/g,"-")
      .replace(/(^-|-$)/g,"");
  }
})();
</script>
</body>
</html>
